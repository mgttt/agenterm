[package]
name = "agenterm"
version = "0.1.3"
edition = "2024"
description = "A tabbed Windows cmd.exe terminal with persistent exited tabs"
license = "MIT OR Apache-2.0"
autobins = false

[[bin]]
name = "agenterm"
path = "src/bin/agenterm.rs"

[[bin]]
name = "agentermctl"
path = "src/bin/agentermctl.rs"

[[bin]]
name = "agenterm-mux"
path = "src/bin/agenterm-mux.rs"

[dependencies]
anyhow = "1"
rmux-pty = "0.9.1"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.16"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
 "Win32_Graphics_Gdi",
 "Win32_System_LibraryLoader",
 "Win32_UI_Input_KeyboardAndMouse",
 "Win32_UI_Shell",
 "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.dev]
debug = 1
incremental = true

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
