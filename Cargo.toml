[workspace]
members = [".", "examples/size-probe", "crates/agenterm-con", "crates/agenterm-cu", "crates/agenterm-platform", "crates/agenterm-abi", "crates/agenterm-ui-core", "crates/agenterm-script-common", "crates/agenterm-rh", "crates/agenterm-lua", "crates/agenterm-qjs", "crates/agenterm-sql", "crates/agenterm-wasmcore", "crates/agenterm-dyn", "crates/agenterm-chassis", "crates/agenterm-tinyvm"]
resolver = "2"

[package]
name = "agenterm"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "A tabbed Windows cmd.exe terminal with persistent exited tabs"
license = "MIT OR Apache-2.0"
autobins = false

[[bin]]
name = "agenterm"
path = "src/bin/agenterm.rs"

[[bin]]
name = "agenterm-com"
path = "src/bin/agenterm-com.rs"

[[bin]]
name = "agenterm-cc"
path = "src/bin/agenterm-cc.rs"

[features]
default = []
script-lua = ["agenterm-lua"]
script-sql = ["agenterm-sql"]
script-qjs = ["agenterm-qjs"]
script-wasmcore = ["agenterm-wasmcore"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("agenterm-lua", "agenterm-qjs", "agenterm-sql", "agenterm-wasmcore", "default", "script-lua", "script-qjs", "script-sql", "script-wasmcore"))'] }

[dependencies]
agenterm-chassis = { path = "crates/agenterm-chassis" }
agenterm-platform = { path = "crates/agenterm-platform", default-features = false, features = ["activation", "clipboard", "console-interrupt", "console-line-editor", "filesystem", "font", "ime", "input", "ipc", "locking", "portable-pixel-window", "process", "pty", "screenshot", "serde", "webview", "window"] }
agenterm-ui-core = { path = "crates/agenterm-ui-core", features = ["terminal-selection"] }
agenterm-rh = { path = "crates/agenterm-rh" }
agenterm-lua = { path = "crates/agenterm-lua", optional = true }
agenterm-qjs = { path = "crates/agenterm-qjs", optional = true }
agenterm-sql = { path = "crates/agenterm-sql", optional = true }
agenterm-wasmcore = { path = "crates/agenterm-wasmcore", optional = true }
ab_glyph = "0.2.32"
anyhow = "1"
png = "0.17"
rhai = { version = "1.22", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
tempfile = "3.25"
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
unicode-width = "0.2"
ureq = { version = "3.3", default-features = false, features = ["native-tls"] }

[target.'cfg(unix)'.dependencies]
unicode-width = "0.2"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
rhai = { version = "1.22", default-features = false, features = ["std", "serde", "metadata"] }

[profile.dev]
debug = 1
incremental = true
panic = "abort"

# `cargo test` links 31 integration binaries, each pulling in the whole crate.
# Carrying dev's debug info through all of them is what drives peak memory on
# an 8 GB machine; line tables still give readable panic locations, which is
# all the suite needs. Set `debug = 1` here when stepping through a test in a
# debugger.
[profile.test]
debug = 0
incremental = true

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Fast optimized builds for local testing. Keep the distributable release
# profile focused on size, while allowing Cargo to reuse work between builds.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# The lightweight host is small enough that one codegen unit adds little local
# latency but prevents the default staged development PE from fragmenting past
# its strict sub-1-MiB product budget. Other workspace packages retain 16-way codegen.
[profile.release-fast.package.agenterm-con]
codegen-units = 1

# The standalone host is built with panic = "unwind" so FFI callbacks may unwind.
# The agenterm-abi cdylib has the same requirement (§3.8 of the libagenterm spec):
# every exported function is wrapped in catch_unwind, which needs unwind support.
[profile.con-dev]
inherits = "dev"
panic = "unwind"

[profile.con-release-fast]
inherits = "release-fast"
panic = "unwind"

[profile.con-release-fast.package.agenterm-con]
codegen-units = 1

[profile.con-release]
inherits = "release"
panic = "unwind"

# agenterm-abi is the libagenterm cdylib: every export is wrapped in
# catch_unwind (§3.8 of the libagenterm spec), which requires unwind. Mirror
# the con-* approach with dedicated unwind profiles; per-package panic overrides
# are not allowed by Cargo.
[profile.abi-dev]
inherits = "dev"
panic = "unwind"

[profile.abi-release]
inherits = "release"
panic = "unwind"

# Static C bridge embedded in an iOS app. The exported boundary catches Rust
# panics and maps them to a stable status, so this profile must preserve unwind.
[profile.tinyvm-ios-release]
inherits = "release"
panic = "unwind"

# Vendored with one change: macOS frames are tagged with the display's color
# space so Core Animation presents without a per-frame vImage conversion.
[patch.crates-io]
softbuffer = { path = "third_party/softbuffer" }
# Vendored with one change: the col_wrap row bookkeeping saturates instead of
# underflowing (and aborting) when a resize or one-line scroll region leaves
# the cursor on the scroll region's top row.
vt100 = { path = "third_party/vt100" }
