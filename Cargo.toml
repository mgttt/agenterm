[workspace]
members = [".", "crates/agenterm-platform", "crates/agenterm-rh"]
resolver = "2"

[package]
name = "agenterm"
version = "0.1.15"
edition = "2024"
rust-version = "1.97"
description = "A tabbed Windows cmd.exe terminal with persistent exited tabs"
license = "MIT OR Apache-2.0"
autobins = false

[[bin]]
name = "agenterm"
path = "src/bin/agenterm.rs"

[[bin]]
name = "agenterm-cli"
path = "src/bin/agenterm-cli.rs"

[[bin]]
name = "agenterm-rhai"
path = "src/bin/agenterm-rhai.rs"

[[bin]]
name = "agenterm-cc"
path = "src/bin/agenterm-cc.rs"

[dependencies]
agenterm-platform = { path = "crates/agenterm-platform", default-features = false, features = ["activation", "clipboard", "console-interrupt", "console-line-editor", "filesystem", "font", "ime", "input", "ipc", "locking", "process", "pty", "screenshot", "serde", "webview", "window"] }
agenterm-rh = { path = "crates/agenterm-rh" }
ab_glyph = "0.2.32"
anyhow = "1"
png = "0.17"
rhai = { version = "1.22", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
unicode-width = "0.2"
ureq = { version = "3.3", default-features = false, features = ["native-tls"] }

[target.'cfg(unix)'.dependencies]
unicode-width = "0.2"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
rhai = { version = "1.22", default-features = false, features = ["std", "serde", "metadata"] }

[profile.dev]
debug = 1
incremental = true

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Fast optimized builds for local testing. Keep the distributable release
# profile focused on size, while allowing Cargo to reuse work between builds.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Vendored with one change: macOS frames are tagged with the display's color
# space so Core Animation presents without a per-frame vImage conversion.
[patch.crates-io]
softbuffer = { path = "third_party/softbuffer" }
# Vendored with one change: the col_wrap row bookkeeping saturates instead of
# underflowing (and aborting) when a resize or one-line scroll region leaves
# the cursor on the scroll region's top row.
vt100 = { path = "third_party/vt100" }
