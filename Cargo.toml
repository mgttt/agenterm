[package]
name = "agenterm"
version = "0.1.9+hotfix.1"
edition = "2024"
rust-version = "1.97"
description = "A tabbed Windows cmd.exe terminal with persistent exited tabs"
license = "MIT OR Apache-2.0"
autobins = false

[[bin]]
name = "agenterm"
path = "src/bin/agenterm.rs"

[[bin]]
name = "agenterm-cli"
path = "src/bin/agenterm-cli.rs"

[[bin]]
name = "agenterm-mux"
path = "src/bin/agenterm-mux.rs"

[[bin]]
name = "agenterm-script"
path = "src/bin/agenterm-script.rs"

[[bin]]
name = "agenterm-server"
path = "src/bin/agenterm-server.rs"

[[bin]]
name = "agenterm-mcp"
path = "src/bin/agenterm-mcp.rs"

[dependencies]
anyhow = "1"
png = "0.17"
rhai = { version = "1.22", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
rmux-pty = "0.9.1"
unicode-width = "0.2"
ureq = { version = "3.3", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
softbuffer = "0.4"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
winit = { version = "0.30", default-features = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
debug = 1
incremental = true

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Fast optimized builds for local testing. Keep the distributable release
# profile focused on size, while allowing Cargo to reuse work between builds.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
