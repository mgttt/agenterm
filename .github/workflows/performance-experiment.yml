name: CI performance experiment

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to benchmark
        required: true
        type: string
      runner_class:
        description: Standard runner or configured trial runner
        required: true
        default: standard
        type: choice
        options:
          - standard
          - trial
      compiler_cache:
        description: Compilation cache strategy
        required: true
        default: target
        type: choice
        options:
          - target
          - sccache
          - none

concurrency:
  group: performance-experiment-${{ inputs.source_sha }}-${{ inputs.runner_class }}-${{ inputs.compiler_cache }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Validate bounded experiment selection
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUNNER_CLASS: ${{ inputs.runner_class }}
          TRIAL_RUNNER: ${{ vars.AGENTERM_WINDOWS_EXPERIMENT_RUNNER }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$RUNNER_CLASS" == "trial" ]]; then
            test -n "$TRIAL_RUNNER"
          fi

  benchmark:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    runs-on: >-
      ${{
        inputs.runner_class == 'trial' &&
        vars.AGENTERM_WINDOWS_EXPERIMENT_RUNNER ||
        'windows-latest'
      }}
    timeout-minutes: 45
    env:
      AGENTERM_NO_ACTIVATE: "1"
      CARGO_INCREMENTAL: ${{ inputs.compiler_cache == 'sccache' && '0' || '1' }}
      RUSTC_WRAPPER: ${{ inputs.compiler_cache == 'sccache' && 'sccache' || '' }}
      SCCACHE_GHA_ENABLED: ${{ inputs.compiler_cache == 'sccache' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Verify exact source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Restore isolated target experiment cache
        if: inputs.compiler_cache == 'target'
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/debug/
            target/.rustc_info.json
          key: perf-target-v1-${{ inputs.runner_class }}-windows-x86_64-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ inputs.source_sha }}-${{ matrix.sample }}
          restore-keys: |
            perf-target-v1-${{ inputs.runner_class }}-windows-x86_64-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-

      - name: Configure pinned sccache experiment
        if: inputs.compiler_cache == 'sccache'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install lint components
        run: rustup component add rustfmt clippy

      - name: Run exact Quick workload
        shell: cmd
        run: >-
          check.cmd --quick
          --timing target\qualification\performance-${{ matrix.sample }}.json

      - name: Capture sccache statistics
        if: always() && inputs.compiler_cache == 'sccache'
        continue-on-error: true
        shell: bash
        run: sccache --show-stats --stats-format json >sccache-${{ matrix.sample }}.json

      - name: Save isolated target experiment cache
        if: success() && inputs.compiler_cache == 'target'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/debug/
            target/.rustc_info.json
          key: perf-target-v1-${{ inputs.runner_class }}-windows-x86_64-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ inputs.source_sha }}-${{ matrix.sample }}

      - name: Upload bounded experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-${{ inputs.runner_class }}-${{ inputs.compiler_cache }}-${{ github.run_id }}-${{ matrix.sample }}
          path: |
            target/qualification/performance-${{ matrix.sample }}.json
            sccache-${{ matrix.sample }}.json
          if-no-files-found: warn
          retention-days: 14
