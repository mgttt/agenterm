name: CI / agenterm

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ci-agenterm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: agenterm quality and shared contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy workbench targets
        run: cargo clippy --locked -p agenterm --all-targets -- -D warnings
      - name: Build script worker prerequisite
        run: cargo build --locked -p agenterm --bin agenterm
      - name: Test workbench library
        run: cargo test --locked -p agenterm --lib
      - name: Test shared UI core
        run: cargo test --locked -p agenterm-ui-core --lib
      - name: Test platform contracts
        run: cargo test --locked -p agenterm-platform --lib --all-features
      - name: Prove Rh AOT pack pipeline
        run: ./rh-check.sh

  target-cells:
    name: agenterm / ${{ matrix.cell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: win-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            kind: native
          - cell: win-aarch64
            runner: ubuntu-latest
            target: aarch64-pc-windows-msvc
            kind: xwin
          - cell: lnx-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            kind: native
          - cell: lnx-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            kind: linux-cross
          - cell: osx-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            kind: native
          - cell: osx-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            kind: native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - name: Install Windows cross tooling
        if: matrix.kind == 'xwin'
        run: cargo install cargo-xwin --locked
      - name: Install Linux aarch64 linker
        if: matrix.kind == 'linux-cross'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Check agenterm through cargo-xwin
        if: matrix.kind == 'xwin'
        run: cargo xwin check --locked -p agenterm --all-targets --target ${{ matrix.target }}
      - name: Check agenterm native/cross target
        if: matrix.kind != 'xwin'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --locked -p agenterm --all-targets --target ${{ matrix.target }}

  libagenterm-abi:
    name: libagenterm ABI (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install Rust ABI toolchain components
        run: rustup component add clippy
      - name: Build libagenterm ABI (abi-release)
        run: cargo build --locked -p agenterm-abi --profile abi-release
      - name: Test libagenterm ABI (abi-dev)
        run: cargo test --locked -p agenterm-abi --profile abi-dev
      - name: C ABI evidence (toolchain + artifact sizes)
        run: |
          cargo test --locked -p agenterm-abi --profile abi-dev --test c_consumer -- --nocapture
          cargo test --locked -p agenterm-abi --profile abi-dev --test c_static_link -- --nocapture
      - name: Clippy libagenterm ABI (abi-dev)
        run: cargo clippy --locked -p agenterm-abi --profile abi-dev --all-targets --no-deps -- -D warnings

  libagenterm-abi-macos:
    name: libagenterm ABI (macos)
    # macOS 交付通道:真实构建并验证 libagenterm.dylib 与 libagenterm.a
    # (c_consumer / c_static_link 必须真跑,不许 SKIP)。
    # 故意没有 brew 步骤——linux 那轮已证明编译期平台栈是纯 Rust(窗口 /
    # 剪贴板 / a11y 适配层全部 dlopen/dyn 加载,不链接系统 -dev 包),
    # macos-latest 自带的 clang 覆盖 C probe 编译。运行期 headless runner
    # 上窗口 / 剪贴板 / a11y 由适配层短路为 AGT_UNSUPPORTED(测试按设计
    # SKIP,不触碰 AppKit 主线程限制,已声明于 include/agenterm.h 与
    # README)。若 CI 首次运行报缺库,按报错补 brew 包,并回填本注释。
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install Rust ABI toolchain components
        run: rustup component add clippy
      - name: Build libagenterm ABI (abi-release)
        run: cargo build --locked -p agenterm-abi --profile abi-release
      - name: Test libagenterm ABI (abi-dev)
        run: cargo test --locked -p agenterm-abi --profile abi-dev
      - name: C ABI evidence (toolchain + artifact sizes)
        run: |
          cargo test --locked -p agenterm-abi --profile abi-dev --test c_consumer -- --nocapture
          cargo test --locked -p agenterm-abi --profile abi-dev --test c_static_link -- --nocapture
      - name: Clippy libagenterm ABI (abi-dev)
        run: cargo clippy --locked -p agenterm-abi --profile abi-dev --all-targets --no-deps -- -D warnings

  libagenterm-abi-linux:
    name: libagenterm ABI (linux)
    # Linux 交付通道:真实构建并验证 libagenterm.so 与 libagenterm.a(c_consumer /
    # c_static_link 必须真跑,不许 SKIP)。
    # 故意没有 apt 步骤——实测依据(交叉 cargo check/clippy 通过 + 代码路径分析):
    # 编译期平台栈在 Linux 上是纯 Rust(winit+wayland-dlopen / x11rb / atspi /
    # zbus / softbuffer),零系统 -dev 包;运行期 headless runner 上窗口 / 剪贴板 /
    # a11y 由适配层短路为 AGT_UNSUPPORTED(测试按设计 SKIP,不触碰 xkbcommon 等
    # dlopen 库),PTY / C probe 只用 ubuntu-latest 自带的 gcc 与 glibc。
    # 若 CI 首次运行报缺库,按报错补 apt 包,并回填本注释与
    # crates/agenterm-abi/README.md 的 Unix 系统库列表。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install Rust ABI toolchain components
        run: rustup component add clippy
      - name: Build libagenterm ABI (abi-release)
        run: cargo build --locked -p agenterm-abi --profile abi-release
      - name: Test libagenterm ABI (abi-dev)
        run: cargo test --locked -p agenterm-abi --profile abi-dev
      - name: C ABI evidence (toolchain + artifact sizes)
        run: |
          cargo test --locked -p agenterm-abi --profile abi-dev --test c_consumer -- --nocapture
          cargo test --locked -p agenterm-abi --profile abi-dev --test c_static_link -- --nocapture
      - name: Clippy libagenterm ABI (abi-dev)
        run: cargo clippy --locked -p agenterm-abi --profile abi-dev --all-targets --no-deps -- -D warnings
