            echo "windows_aarch64_client_build_ms: ${{ steps.client-build.outputs.duration_ms || 'n/a' }}"
            echo "windows_aarch64_client_smoke_ms: ${{ steps.client-smoke.outputs.duration_ms || 'n/a' }}"
