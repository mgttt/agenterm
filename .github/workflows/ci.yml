name: CI

on:
  # Manual re-run lane: the Candidate preflight requires a successful CI run
  # at the exact main HEAD SHA. If that run is cancelled or deleted, a push
  # cannot re-trigger CI for the same SHA, so the release chain dead-ends.
  workflow_dispatch:
  push:
    # Documentation-only commits cannot change build or test outcomes, and
    # every extra full-matrix run competes for the runners that release CI
    # needs. Code paths still trigger the complete matrix.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plan/**'
      - 'prd/**'
      - 'assets/**'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plan/**'
      - 'prd/**'
      - 'assets/**'
      - 'LICENSE*'

concurrency:
  # Per-SHA groups: concurrent agents pushing different commits to main no
  # longer displace each other, so every commit can reach the completed
  # successful run the release preflight requires. Re-running the same SHA
  # still supersedes its own earlier run.
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per platform runs every agenterm-platform check. Three separate
  # matrices previously spread the same work across nine jobs, each paying its
  # own checkout and toolchain setup for well under a minute of real work.
  platform-contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            unix_tests: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            unix_tests: true
          # macos-13 is being retired and its queue starves release CI;
          # macos-15-intel is the current x86_64 macOS image.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            unix_tests: false
          - os: macos-14
            target: aarch64-apple-darwin
            unix_tests: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Restore Cargo downloads
        id: restore-cargo-home-platform-contract
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-platform-contract-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-v2-platform-contract-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-rust1.97-
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - name: Check filesystem conventions minimal feature
        run: >-
          cargo check --locked -p agenterm-platform
          --target ${{ matrix.target }}
          --no-default-features
          --features filesystem-conventions
      - name: Assert filesystem conventions dependency surface
        shell: bash
        env:
          CARGO_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tree="$(cargo tree --locked -p agenterm-platform \
            --target "$CARGO_TARGET" --no-default-features \
            --features filesystem-conventions --edges normal --format '{p}')"
          for native in libc windows-sys; do
            if grep -qE "^${native} " <<<"$tree"; then
              echo "filesystem-conventions unexpectedly enables native dependency '${native}'" >&2
              exit 1
            fi
          done
      - name: Check filesystem minimal feature
        run: >-
          cargo check --locked -p agenterm-platform
          --target ${{ matrix.target }}
          --no-default-features
          --features filesystem
      - name: Run native locking minimal-feature tests
        run: >-
          cargo test --locked -p agenterm-platform
          --no-default-features --features locking
      - name: Run platform Unix tests
        if: matrix.unix_tests
        run: >-
          cargo test --locked -p agenterm-platform --all-features
          --target ${{ matrix.target }}
      - name: Save Cargo downloads
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-platform-contract-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Restore Cargo downloads
        id: restore-cargo-home-windows-x86_64
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-windows-x86_64-native-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-v2-windows-x86_64-native-${{ runner.os }}-${{ runner.arch }}-rust1.97-
      - name: Restore Windows x86_64 build target
        id: restore-target-windows-x86_64
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/debug/
            target/.rustc_info.json
          key: cargo-target-v2-windows-x86_64-native-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-v2-windows-x86_64-native-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-
      - name: Install lint components
        id: install-lint
        shell: bash
        run: |
          set -euo pipefail
          start_ms=$(date +%s%3N)
          rustup component add rustfmt clippy
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Run quality gate
        id: quality-gate
        shell: bash
        run: |
          set -euo pipefail
          start_ms=$(date +%s%3N)
          ./check.cmd --skip-smoke --timing target/qualification/timing.json
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
        # note: check command runtime includes lint + quick integrated checks in this lane
      - name: Run representative public-interface slice
        id: public-interface
        shell: bash
        env:
          AGENTERM_NO_ACTIVATE: "1"
        run: |
          set -euo pipefail
          start_ms=$(date +%s%3N)
          dist/agenterm-rhai.exe task run startup-smoke --manifest agenterm.tasks.json
          dist/agenterm-rhai.exe task run cli-smoke --manifest agenterm.tasks.json
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Prove native Windows IPC main/dev authorities
        id: native-ipc-main-dev
        shell: bash
        env:
          AGENTERM_NO_ACTIVATE: "1"
        run: |
          set -euo pipefail
          start_ms=$(date +%s%3N)
          dist/agenterm-rhai.exe task run native-ipc-smoke \
            --manifest agenterm.tasks.json -- --ci-main-dev
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Prove published Windows IPC upgrade and rollback
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: native-ipc-compat
        shell: bash
        env:
          AGENTERM_NO_ACTIVATE: "1"
        run: |
          set -euo pipefail
          start_ms=$(date +%s%3N)
          dist/agenterm-rhai.exe task run native-ipc-compat-smoke \
            --manifest agenterm.tasks.json
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Publish Windows quality timing summary
        if: always()
        continue-on-error: true
        shell: cmd
        run: |
          @if not exist target\qualification\timing.json exit /b 0
          @if exist dist\agenterm-rhai.exe (
            dist\agenterm-rhai.exe task run timing-summary --manifest agenterm.tasks.json -- target\qualification\timing.json
          ) else (
            target\debug\agenterm-rhai.exe task run timing-summary --manifest agenterm.tasks.json -- target\qualification\timing.json
          )
      - name: Report cache hit profile
        if: always()
        shell: bash
        run: |
          {
            echo "### CI cache profile (windows-x86_64)"
            echo "windows-x86_64.target-hit: ${{ steps.restore-target-windows-x86_64.outputs.cache-hit }}"
            echo "windows-x86_64.cargo-home-hit: ${{ steps.restore-cargo-home-windows-x86_64.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report CI phase timing
        if: always()
        shell: bash
        run: |
          {
            echo "### CI phase timing"
            echo "windows_install_lint_ms: ${{ steps.install-lint.outputs.duration_ms || 'n/a' }}"
            echo "windows_quality_gate_ms: ${{ steps.quality-gate.outputs.duration_ms || 'n/a' }}"
            echo "windows_public_interface_ms: ${{ steps.public-interface.outputs.duration_ms || 'n/a' }}"
            echo "windows_native_ipc_main_dev_ms: ${{ steps.native-ipc-main-dev.outputs.duration_ms || 'n/a' }}"
            echo "windows_native_ipc_compat_ms: ${{ steps.native-ipc-compat.outputs.duration_ms || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Windows quality timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-timing-windows-x86_64-${{ github.run_id }}
          path: target/qualification/timing.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save Windows x86_64 build target
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/debug/
            target/.rustc_info.json
          key: cargo-target-v2-windows-x86_64-native-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
      - name: Save Cargo downloads
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-windows-x86_64-native-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}

  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Restore Cargo downloads
        id: restore-cargo-home-linux-x86_64
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-linux-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-v2-linux-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-
      - name: Restore Linux x86_64 build targets
        id: restore-target-linux-x86_64
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/debug/
            target/x86_64-unknown-linux-gnu/debug/
            target/.rustc_info.json
          key: cargo-target-v2-linux-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-v2-linux-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-
      - name: Install host dependencies
        id: install-deps
        run: |
          start_ms=$(date +%s%3N)
          rustup component add rustfmt clippy
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 \
            openbox x11-utils xauth xclip xdotool xvfb
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Run portable quality gate
        id: quality-gate
        run: |
          start_ms=$(date +%s%3N)
          ./check.sh --quick \
            --target x86_64-unknown-linux-gnu \
            --timing target/qualification/timing.json
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Report cache hit profile
        if: always()
        shell: bash
        run: |
          {
            echo "### CI cache profile (linux-x86_64)"
            echo "linux-x86_64.target-hit: ${{ steps.restore-target-linux-x86_64.outputs.cache-hit }}"
            echo "linux-x86_64.cargo-home-hit: ${{ steps.restore-cargo-home-linux-x86_64.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report CI phase timing
        if: always()
        shell: bash
        run: |
          {
            echo "### CI phase timing"
            echo "linux_x86_64_install_deps_ms: ${{ steps.install-deps.outputs.duration_ms || 'n/a' }}"
            echo "linux_x86_64_quality_gate_ms: ${{ steps.quality-gate.outputs.duration_ms || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Audit cross-platform automation ownership
        env:
          AGENTERM_BOOTSTRAP_TASK: cross-platform-automation-audit
        run: ./scripts/bootstrap.sh
      - name: Probe manifest client set
        env:
          AGENTERM_BOOTSTRAP_TASK: client-smoke
        run: >-
          ./scripts/bootstrap.sh linux x86_64
          target/x86_64-unknown-linux-gnu/debug
      - name: Prove native Unix IPC authorities
        env:
          AGENTERM_BOOTSTRAP_TASK: native-ipc-smoke
        run: >-
          ./scripts/bootstrap.sh
          --server target/x86_64-unknown-linux-gnu/debug/agenterm-server
          --cli target/x86_64-unknown-linux-gnu/debug/agenterm-cli
          --ci-main-dev
      - name: Prove published Linux IPC upgrade and rollback
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: native-ipc-compat
        run: |
          start_ms=$(date +%s%3N)
          target/x86_64-unknown-linux-gnu/debug/agenterm-rhai task run \
            write-build-metadata --manifest agenterm.tasks.json -- \
            . target/x86_64-unknown-linux-gnu/debug/agenterm.json \
            scripts/artifacts.json \
            target/x86_64-unknown-linux-gnu/debug dev linux x86_64
          target/x86_64-unknown-linux-gnu/debug/agenterm-rhai task run \
            native-ipc-compat-smoke --manifest agenterm.tasks.json -- \
            --head-server target/x86_64-unknown-linux-gnu/debug/agenterm-server \
            --head-cli target/x86_64-unknown-linux-gnu/debug/agenterm-cli \
            --head-metadata target/x86_64-unknown-linux-gnu/debug/agenterm.json
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64_native_ipc_compat_ms: $duration_ms" >> "$GITHUB_STEP_SUMMARY"
      - name: Prove native Linux Control Center lifecycle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: control-center-smoke
        env:
          AGENTERM_NO_ACTIVATE: "1"
        run: |
          start_ms=$(date +%s%3N)
          set +e
          control_center_output=$(xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' bash -ceu '
            openbox --sm-disable >target/control-center-openbox.log 2>&1 &
            window_manager=$!
            trap "kill $window_manager 2>/dev/null || true; wait $window_manager 2>/dev/null || true" EXIT
            ready=
            for attempt in $(seq 1 100); do
              if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id"; then
                ready=1
                break
              fi
              sleep 0.05
            done
            test "$ready" = 1
            AGENTERM_BOOTSTRAP_TASK=control-center-linux-smoke \
              ./scripts/bootstrap.sh --backend x11
          ' 2>&1)
          control_center_status=$?
          set -e
          printf '%s\n' "$control_center_output"
          if [ "$control_center_status" -ne 0 ]; then
            diagnostic=$(printf '%s' "$control_center_output" | tail -c 2000 | tr '\r\n' '  ')
            diagnostic=${diagnostic//%/%25}
            echo "::error title=Linux Control Center smoke::$diagnostic"
            exit "$control_center_status"
          fi
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
           echo "linux_x86_64_control_center_smoke_ms: $duration_ms" >> "$GITHUB_STEP_SUMMARY"
      - name: Prove native Linux AgenTerm workbench and clipboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: unix-frontend-smoke
        env:
          AGENTERM_NO_ACTIVATE: "1"
        run: |
          start_ms=$(date +%s%3N)
          set +e
          journey_output=$(xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' bash -ceu '
            openbox --sm-disable >target/unix-frontend-openbox.log 2>&1 &
            window_manager=$!
            trap "kill $window_manager 2>/dev/null || true; wait $window_manager 2>/dev/null || true" EXIT
            ready=
            for attempt in $(seq 1 100); do
              if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id"; then
                ready=1
                break
              fi
              sleep 0.05
            done
            test "$ready" = 1
            AGENTERM_BOOTSTRAP_TASK=unix-frontend-linux-smoke \
              ./scripts/bootstrap.sh \
              target/x86_64-unknown-linux-gnu/debug/agenterm \
              target/x86_64-unknown-linux-gnu/debug/agenterm-cli \
              --platform linux
          ' 2>&1)
          journey_status=$?
          set -e
          printf '%s\n' "$journey_output"
          if [ "$journey_status" -ne 0 ]; then
            diagnostic=$(printf '%s' "$journey_output" | tail -c 2000 | tr '\r\n' '  ')
            diagnostic=${diagnostic//%/%25}
            echo "::error title=Linux Unix frontend smoke::$diagnostic"
            exit "$journey_status"
          fi
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64_unix_frontend_smoke_ms: $duration_ms" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise public Linux Script CLI
        run: cargo test --locked --target x86_64-unknown-linux-gnu --test linux_script_cli
      - name: Validate isolated agenterm-net research loop
        env:
          AGENTERM_BOOTSTRAP_TASK: agenterm-net-research
        run: ./scripts/bootstrap.sh
      - name: Publish Linux quality timing summary
        if: always()
        continue-on-error: true
        run: |
          test ! -f target/qualification/timing.json ||
            target/x86_64-unknown-linux-gnu/debug/agenterm-rhai task run timing-summary \
              --manifest agenterm.tasks.json -- \
              target/qualification/timing.json
      - name: Upload Linux quality timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-timing-linux-x86_64-${{ github.run_id }}
          path: target/qualification/timing.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save Linux x86_64 build targets
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/debug/
            target/x86_64-unknown-linux-gnu/debug/
            target/.rustc_info.json
          key: cargo-target-v2-linux-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
      - name: Save Cargo downloads
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-linux-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}

  linux-aarch64:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Restore Linux ARM64 Cargo downloads
        id: restore-cargo-home-linux-aarch64
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-linux-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-v2-linux-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-
      - name: Restore Linux ARM64 build target
        id: restore-target-linux-aarch64
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/aarch64-unknown-linux-gnu/debug/
            target/.rustc_info.json
          key: cargo-target-v2-linux-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-v2-linux-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-
      - name: Install target dependencies
        id: install-deps
        run: |
          start_ms=$(date +%s%3N)
          rustup component add clippy
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libxkbcommon0 libxkbcommon-x11-0
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - start_ms))
