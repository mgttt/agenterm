      - name: Clippy manifest client set
        id: client-clippy
        env:
          AGENTERM_BOOTSTRAP_TASK: client-clippy
        run: |
          start_ms=$(date +%s%3N)
          ./scripts/bootstrap.sh --target aarch64-unknown-linux-gnu
          end_ms=$(date +%s%3N)
