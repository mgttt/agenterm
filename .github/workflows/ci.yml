name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Restore Cargo downloads
        id: restore-cargo-home-windows-x86_64
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-windows-x86_64-native-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-v2-windows-x86_64-native-${{ runner.os }}-${{ runner.arch }}-rust1.97-
      - name: Restore Windows x86_64 build target
        id: restore-target-windows-x86_64
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/debug/
            target/.rustc_info.json
          key: cargo-target-v2-windows-x86_64-native-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-v2-windows-x86_64-native-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-
      - name: Install lint components
        run: rustup component add rustfmt clippy
      - name: Run quality gate
        shell: cmd
        run: check.cmd --skip-smoke --timing target/qualification/timing.json
      - name: Run representative public-interface slice
        shell: cmd
        env:
          AGENTERM_NO_ACTIVATE: "1"
        run: |
          @echo off
          dist\agenterm-script.exe task run startup-smoke --manifest agenterm.tasks.json
          if errorlevel 1 exit /b %ERRORLEVEL%
          dist\agenterm-script.exe task run cli-smoke --manifest agenterm.tasks.json
          exit /b %ERRORLEVEL%
      - name: Publish Windows quality timing summary
        if: always()
        continue-on-error: true
        shell: cmd
        run: |
          @if not exist target\qualification\timing.json exit /b 0
          @if exist dist\agenterm-script.exe (
            dist\agenterm-script.exe task run timing-summary --manifest agenterm.tasks.json -- target\qualification\timing.json
          ) else (
            target\debug\agenterm-script.exe task run timing-summary --manifest agenterm.tasks.json -- target\qualification\timing.json
          )
      - name: Report cache hit profile
        if: always()
        shell: bash
        run: |
          {
            echo "### CI cache profile (windows-x86_64)"
            echo "windows-x86_64.target-hit: ${{ steps.restore-target-windows-x86_64.outputs.cache-hit }}"
            echo "windows-x86_64.cargo-home-hit: ${{ steps.restore-cargo-home-windows-x86_64.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Windows quality timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-timing-windows-x86_64-${{ github.run_id }}
          path: target/qualification/timing.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save Windows x86_64 build target
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/debug/
            target/.rustc_info.json
          key: cargo-target-v2-windows-x86_64-native-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
      - name: Save Cargo downloads
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-windows-x86_64-native-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}

  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Restore Cargo downloads
        id: restore-cargo-home-linux-x86_64
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-linux-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-v2-linux-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-
      - name: Restore Linux x86_64 build targets
        id: restore-target-linux-x86_64
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/debug/
            target/x86_64-unknown-linux-gnu/debug/
            target/.rustc_info.json
          key: cargo-target-v2-linux-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-v2-linux-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-
      - name: Install host dependencies
        run: |
          rustup component add rustfmt clippy
          sudo apt-get update
          sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libwayland-client0
      - name: Run portable quality gate
        run: >-
          ./check.sh --quick
          --target x86_64-unknown-linux-gnu
          --timing target/qualification/timing.json
      - name: Report cache hit profile
        if: always()
        shell: bash
        run: |
          {
            echo "### CI cache profile (linux-x86_64)"
            echo "linux-x86_64.target-hit: ${{ steps.restore-target-linux-x86_64.outputs.cache-hit }}"
            echo "linux-x86_64.cargo-home-hit: ${{ steps.restore-cargo-home-linux-x86_64.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Audit cross-platform automation ownership
        env:
          AGENTERM_BOOTSTRAP_TASK: cross-platform-automation-audit
        run: ./scripts/bootstrap.sh
      - name: Probe manifest client set
        env:
          AGENTERM_BOOTSTRAP_TASK: client-smoke
        run: >-
          ./scripts/bootstrap.sh linux x86_64
          target/x86_64-unknown-linux-gnu/debug
      - name: Prove native Unix IPC authorities
        env:
          AGENTERM_BOOTSTRAP_TASK: native-ipc-smoke
        run: >-
          ./scripts/bootstrap.sh
          --server target/x86_64-unknown-linux-gnu/debug/agenterm-server
          --cli target/x86_64-unknown-linux-gnu/debug/agenterm-cli
          --ci-main-dev
      - name: Exercise public Linux Script CLI
        run: cargo test --locked --target x86_64-unknown-linux-gnu --test linux_script_cli
      - name: Validate isolated agenterm-net research loop
        env:
          AGENTERM_BOOTSTRAP_TASK: agenterm-net-research
        run: ./scripts/bootstrap.sh
      - name: Publish Linux quality timing summary
        if: always()
        continue-on-error: true
        run: |
          test ! -f target/qualification/timing.json ||
            target/debug/agenterm-script task run timing-summary \
              --manifest agenterm.tasks.json -- \
              target/qualification/timing.json
      - name: Upload Linux quality timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-timing-linux-x86_64-${{ github.run_id }}
          path: target/qualification/timing.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save Linux x86_64 build targets
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/debug/
            target/x86_64-unknown-linux-gnu/debug/
            target/.rustc_info.json
          key: cargo-target-v2-linux-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
      - name: Save Cargo downloads
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-linux-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}

  linux-aarch64:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Restore Linux ARM64 Cargo downloads
        id: restore-cargo-home-linux-aarch64
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-linux-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-v2-linux-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-
      - name: Restore Linux ARM64 build target
        id: restore-target-linux-aarch64
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/aarch64-unknown-linux-gnu/debug/
            target/.rustc_info.json
          key: cargo-target-v2-linux-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-v2-linux-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-
      - name: Install target dependencies
        run: |
          rustup component add clippy
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libxkbcommon0 libxkbcommon-x11-0
      - name: Clippy manifest client set
        env:
          AGENTERM_BOOTSTRAP_TASK: client-clippy
        run: ./scripts/bootstrap.sh --target aarch64-unknown-linux-gnu
      - name: Build manifest client set
        env:
          AGENTERM_BOOTSTRAP_TASK: client-build
        run: ./scripts/bootstrap.sh --target aarch64-unknown-linux-gnu
      - name: Verify manifest client set exists
        env:
          AGENTERM_BOOTSTRAP_TASK: client-smoke
        run: >-
          ./scripts/bootstrap.sh linux aarch64
          target/aarch64-unknown-linux-gnu/debug --existence-only
      - name: Report cache hit profile
        if: always()
        shell: bash
        run: |
          {
            echo "### CI cache profile (linux-aarch64)"
            echo "linux-aarch64.target-hit: ${{ steps.restore-target-linux-aarch64.outputs.cache-hit }}"
            echo "linux-aarch64.cargo-home-hit: ${{ steps.restore-cargo-home-linux-aarch64.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save Linux ARM64 build target
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/aarch64-unknown-linux-gnu/debug/
            target/.rustc_info.json
          key: cargo-target-v2-linux-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
      - name: Save Linux ARM64 Cargo downloads
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-linux-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}

  macos:
    strategy:
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Restore macOS Cargo downloads
        id: restore-cargo-home-macos
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-macos-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-v2-macos-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-rust1.97-
      - name: Restore macOS build target
        id: restore-target-macos
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/${{ matrix.target }}/debug/
            target/.rustc_info.json
          key: cargo-target-v2-macos-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-v2-macos-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-
      - name: Install target
        run: |
          rustup component add clippy
          rustup target add ${{ matrix.target }}
      - name: Clippy manifest client set
        env:
          AGENTERM_BOOTSTRAP_TASK: client-clippy
        run: ./scripts/bootstrap.sh --target ${{ matrix.target }}
      - name: Build manifest client set
        env:
          AGENTERM_BOOTSTRAP_TASK: client-build
        run: ./scripts/bootstrap.sh --target ${{ matrix.target }}
      - name: Verify manifest client set
        env:
          AGENTERM_BOOTSTRAP_TASK: client-smoke
        run: |
          host_arch="$(uname -m)"
          [ "$host_arch" = "arm64" ] && host_arch="aarch64"
          if [ "$host_arch" = "${{ matrix.arch }}" ]; then
            ./scripts/bootstrap.sh macos "${{ matrix.arch }}" \
              "target/${{ matrix.target }}/debug"
          else
            ./scripts/bootstrap.sh macos "${{ matrix.arch }}" \
              "target/${{ matrix.target }}/debug" --existence-only
          fi
      - name: Prove native Unix IPC authorities
        env:
          AGENTERM_BOOTSTRAP_TASK: native-ipc-smoke
        run: |
          host_arch="$(uname -m)"
          [ "$host_arch" = "arm64" ] && host_arch="aarch64"
          if [ "$host_arch" != "${{ matrix.arch }}" ]; then
            echo "Skipping execution-only IPC proof for cross-built ${{ matrix.target }}"
            exit 0
          fi
          ./scripts/bootstrap.sh \
            --server "target/${{ matrix.target }}/debug/agenterm-server" \
            --cli "target/${{ matrix.target }}/debug/agenterm-cli" \
            --ci-main-dev
      - name: Report cache hit profile
        if: always()
        shell: bash
        run: |
          {
            echo "### CI cache profile (macos-${{ matrix.arch }})"
            echo "macos-${{ matrix.arch }}.target-hit: ${{ steps.restore-target-macos.outputs.cache-hit }}"
            echo "macos-${{ matrix.arch }}.cargo-home-hit: ${{ steps.restore-cargo-home-macos.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save macOS build target
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/${{ matrix.target }}/debug/
            target/.rustc_info.json
          key: cargo-target-v2-macos-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
      - name: Save macOS Cargo downloads
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-macos-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}

  windows-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Restore Windows ARM64 cargo downloads
        id: restore-cargo-home-windows-aarch64-ci
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-ci-windows-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-ci-windows-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-
      - name: Restore Windows ARM64 build target
        id: restore-target-windows-aarch64-ci
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/aarch64-pc-windows-msvc/
            ~/.cache/cargo-xwin/
          key: cargo-target-v2-windows-aarch64-ci-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-v2-windows-aarch64-ci-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-
      - name: Install cross tooling
        run: |
          rustup component add clippy
          rustup target add aarch64-pc-windows-msvc
          cargo install cargo-xwin --locked
      - name: Clippy manifest client set
        env:
          AGENTERM_BOOTSTRAP_TASK: client-clippy
        run: >-
          ./scripts/bootstrap.sh --target aarch64-pc-windows-msvc
          --driver cargo-xwin
      - name: Build manifest client set
        env:
          AGENTERM_BOOTSTRAP_TASK: client-build
        run: >-
          ./scripts/bootstrap.sh --target aarch64-pc-windows-msvc
          --driver cargo-xwin
      - name: Verify manifest client set exists
        env:
          AGENTERM_BOOTSTRAP_TASK: client-smoke
        run: >-
          ./scripts/bootstrap.sh windows aarch64
          target/aarch64-pc-windows-msvc/debug --existence-only
      - name: Report cache hit profile
        if: always()
        shell: bash
        run: |
          {
            echo "### CI cache profile (windows-aarch64)"
            echo "windows-aarch64.target-hit: ${{ steps.restore-target-windows-aarch64-ci.outputs.cache-hit }}"
            echo "windows-aarch64.cargo-home-hit: ${{ steps.restore-cargo-home-windows-aarch64-ci.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save Windows ARM64 build target
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/aarch64-pc-windows-msvc/
            ~/.cache/cargo-xwin/
          key: cargo-target-v2-windows-aarch64-ci-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
      - name: Save Windows ARM64 Cargo downloads
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
