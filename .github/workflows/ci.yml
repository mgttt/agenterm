        id: install-cross-tooling
        run: |
          start_ms=$(date +%s%3N)
          rustup component add clippy
          rustup target add aarch64-pc-windows-msvc
          CARGO_XWIN_VERSION="0.23.0"
          CARGO_XWIN_BIN="$HOME/.cargo/bin/cargo-xwin"
          cargo_xwin_state="reused"
          cargo_xwin_actual=""
          if [ -x "$CARGO_XWIN_BIN" ]; then
            cargo_xwin_actual="$("$CARGO_XWIN_BIN" --version 2>/dev/null || true)"
          fi
          if [ "$cargo_xwin_actual" != "cargo-xwin $CARGO_XWIN_VERSION" ]; then
            cargo install cargo-xwin --locked \
              --version "=$CARGO_XWIN_VERSION" --force
            cargo_xwin_state="installed"
          fi
          cargo_xwin_actual="$("$CARGO_XWIN_BIN" --version)"
          if [ "$cargo_xwin_actual" != "cargo-xwin $CARGO_XWIN_VERSION" ]; then
            echo "cargo-xwin version mismatch: expected cargo-xwin $CARGO_XWIN_VERSION, got $cargo_xwin_actual" >&2
            exit 1
          fi
          end_ms=$(date +%s%3N)
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
          echo "cargo_xwin_state=$cargo_xwin_state" >> "$GITHUB_OUTPUT"
