            echo "windows_aarch64_install_cross_tooling_ms: ${{ steps.install-cross-tooling.outputs.duration_ms || 'n/a' }}"
            echo "windows_aarch64_cargo_xwin_state: ${{ steps.install-cross-tooling.outputs.cargo_xwin_state || 'n/a' }}"
