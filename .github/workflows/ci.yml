        run: |
          {
            echo "### CI phase timing (linux-aarch64)"
            echo "linux_aarch64_install_deps_ms: ${{ steps.install-deps.outputs.duration_ms || 'n/a' }}"
            echo "linux_aarch64_client_clippy_ms: ${{ steps.client-clippy.outputs.duration_ms || 'n/a' }}"
            echo "linux_aarch64_client_build_ms: ${{ steps.client-build.outputs.duration_ms || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save Linux ARM64 build target
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/aarch64-unknown-linux-gnu/debug/
            target/.rustc_info.json
          key: cargo-target-v2-linux-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
      - name: Save Linux ARM64 Cargo downloads
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-linux-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}

  macos:
    strategy:
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Restore macOS Cargo downloads
        id: restore-cargo-home-macos
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-macos-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-v2-macos-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-rust1.97-
      - name: Restore macOS build target
        id: restore-target-macos
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/${{ matrix.target }}/debug/
            target/.rustc_info.json
          key: cargo-target-v2-macos-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-v2-macos-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-
      - name: Install target
        id: install-target
        run: |
          start_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          rustup component add clippy
          rustup target add ${{ matrix.target }}
          end_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Clippy manifest client set
        id: client-clippy
        env:
          AGENTERM_BOOTSTRAP_TASK: client-clippy
        run: |
          start_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          ./scripts/bootstrap.sh --target ${{ matrix.target }}
          end_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Build manifest client set
        id: client-build
        env:
          AGENTERM_BOOTSTRAP_TASK: client-build
        run: |
          start_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          ./scripts/bootstrap.sh --target ${{ matrix.target }}
          end_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Verify manifest client set
        id: client-smoke
        env:
          AGENTERM_BOOTSTRAP_TASK: client-smoke
        run: |
          start_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          host_arch="$(uname -m)"
          [ "$host_arch" = "arm64" ] && host_arch="aarch64"
          if [ "$host_arch" = "${{ matrix.arch }}" ]; then
            ./scripts/bootstrap.sh macos "${{ matrix.arch }}" \
              "target/${{ matrix.target }}/debug"
          else
            ./scripts/bootstrap.sh macos "${{ matrix.arch }}" \
              "target/${{ matrix.target }}/debug" --existence-only
          fi
          end_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Prove native Unix IPC authorities
        id: native-ipc-smoke
        env:
          AGENTERM_BOOTSTRAP_TASK: native-ipc-smoke
        run: |
          start_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          host_arch="$(uname -m)"
          [ "$host_arch" = "arm64" ] && host_arch="aarch64"
          if [ "$host_arch" != "${{ matrix.arch }}" ]; then
            echo "Skipping execution-only IPC proof for cross-built ${{ matrix.target }}"
            exit 0
          fi
          ./scripts/bootstrap.sh \
            --server "target/${{ matrix.target }}/debug/agenterm-server" \
            --cli "target/${{ matrix.target }}/debug/agenterm-cli" \
            --ci-main-dev
          end_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Prove published macOS IPC upgrade and rollback
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: native-ipc-compat
        run: |
          start_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          host_arch="$(uname -m)"
          [ "$host_arch" = "arm64" ] && host_arch="aarch64"
          if [ "$host_arch" != "${{ matrix.arch }}" ]; then
            echo "Skipping execution-only compatibility proof for cross-built ${{ matrix.target }}"
            exit 0
          fi
          binary_dir="target/${{ matrix.target }}/debug"
          "$binary_dir/agenterm-rhai" task run write-build-metadata \
            --manifest agenterm.tasks.json -- \
            . "$binary_dir/agenterm.json" scripts/artifacts.json \
            "$binary_dir" dev macos "${{ matrix.arch }}"
          "$binary_dir/agenterm-rhai" task run native-ipc-compat-smoke \
            --manifest agenterm.tasks.json -- \
            --head-server "$binary_dir/agenterm-server" \
            --head-cli "$binary_dir/agenterm-cli" \
            --head-metadata "$binary_dir/agenterm.json"
          end_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Prove native macOS Control Center lifecycle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: control-center-smoke
        env:
          AGENTERM_NO_ACTIVATE: "1"
        run: |
          start_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          host_arch="$(uname -m)"
          [ "$host_arch" = "arm64" ] && host_arch="aarch64"
          if [ "$host_arch" != "${{ matrix.arch }}" ]; then
            echo "Skipping execution-only Control Center proof for cross-built ${{ matrix.target }}"
            exit 0
          fi
          binary_dir="target/${{ matrix.target }}/debug"
          set +e
          control_center_output=$("$binary_dir/agenterm-rhai" task run control-center-macos-smoke \
            --manifest agenterm.tasks.json -- \
            --control-center "$binary_dir/agenterm-cc" \
            --server "$binary_dir/agenterm-server" \
            --cli "$binary_dir/agenterm-cli" 2>&1)
          control_center_status=$?
          set -e
          printf '%s\n' "$control_center_output"
          if [ "$control_center_status" -ne 0 ]; then
            diagnostic=$(printf '%s' "$control_center_output" | tail -c 2000 | tr '\r\n' '  ')
            diagnostic=${diagnostic//%/%25}
            echo "::error title=macOS Control Center smoke::$diagnostic"
            exit "$control_center_status"
          fi
          end_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          duration_ms=$((end_ms - start_ms))
           echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Prove native macOS AgenTerm workbench and clipboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: unix-frontend-smoke
        env:
          AGENTERM_NO_ACTIVATE: "1"
        run: |
          start_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          host_arch="$(uname -m)"
          [ "$host_arch" = "arm64" ] && host_arch="aarch64"
          if [ "$host_arch" != "${{ matrix.arch }}" ]; then
            echo "Skipping execution-only Unix frontend proof for cross-built ${{ matrix.target }}"
            exit 0
          fi
          binary_dir="target/${{ matrix.target }}/debug"
          set +e
          journey_output=$("$binary_dir/agenterm-rhai" task run unix-frontend-macos-smoke \
            --manifest agenterm.tasks.json -- \
            "$binary_dir/agenterm" "$binary_dir/agenterm-cli" --platform macos 2>&1)
          journey_status=$?
          set -e
          printf '%s\n' "$journey_output"
          if [ "$journey_status" -ne 0 ]; then
            diagnostic=$(printf '%s' "$journey_output" | tail -c 2000 | tr '\r\n' '  ')
            diagnostic=${diagnostic//%/%25}
            echo "::error title=macOS Unix frontend smoke::$diagnostic"
            exit "$journey_status"
          fi
          end_ms=$(python3 -c 'import time; print(time.time_ns() // 1_000_000)')
          duration_ms=$((end_ms - start_ms))
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
      - name: Report cache hit profile
        if: always()
        shell: bash
        run: |
          {
            echo "### CI cache profile (macos-${{ matrix.arch }})"
            echo "macos-${{ matrix.arch }}.target-hit: ${{ steps.restore-target-macos.outputs.cache-hit }}"
            echo "macos-${{ matrix.arch }}.cargo-home-hit: ${{ steps.restore-cargo-home-macos.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report CI phase timing
        if: always()
        shell: bash
        run: |
          {
            echo "### CI phase timing (macos-${{ matrix.arch }})"
            echo "macos_${{ matrix.arch }}_install_target_ms: ${{ steps.install-target.outputs.duration_ms || 'n/a' }}"
            echo "macos_${{ matrix.arch }}_client_clippy_ms: ${{ steps.client-clippy.outputs.duration_ms || 'n/a' }}"
            echo "macos_${{ matrix.arch }}_client_build_ms: ${{ steps.client-build.outputs.duration_ms || 'n/a' }}"
            echo "macos_${{ matrix.arch }}_client_smoke_ms: ${{ steps.client-smoke.outputs.duration_ms || 'n/a' }}"
            echo "macos_${{ matrix.arch }}_native_ipc_smoke_ms: ${{ steps.native-ipc-smoke.outputs.duration_ms || 'n/a' }}"
            echo "macos_${{ matrix.arch }}_native_ipc_compat_ms: ${{ steps.native-ipc-compat.outputs.duration_ms || 'n/a' }}"
            echo "macos_${{ matrix.arch }}_control_center_smoke_ms: ${{ steps.control-center-smoke.outputs.duration_ms || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save macOS build target
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/${{ matrix.target }}/debug/
            target/.rustc_info.json
          key: cargo-target-v2-macos-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-rust1.97-debug-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ github.sha }}
      - name: Save macOS Cargo downloads
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-v2-macos-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}

  windows-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
