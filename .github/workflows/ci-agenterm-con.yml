name: CI / agenterm-con

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ci-agenterm-con-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-authoritative:
    name: con Windows unwind and public black-box
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      AGENTERM_NO_ACTIVATE: "1"
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install con toolchain components
        run: rustup component add rust-src clippy rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy exact con profile
        run: >-
          cargo clippy -Z build-std=std,panic_unwind,compiler_builtins
          -Z build-std-features=panic-unwind,backtrace-trace-only
          --locked --profile con-release-fast --target x86_64-pc-windows-msvc
          -p agenterm-con --all-targets -- -D warnings
      - name: Validate con capability and evidence contract
        run: >-
          cargo test -Z build-std=std,panic_unwind,compiler_builtins
          -Z build-std-features=panic-unwind,backtrace-trace-only
          --locked --profile con-release-fast --target x86_64-pc-windows-msvc
          -p agenterm-con --test agenterm_con_alignment
      - name: Qualify con sustained long output
        run: >-
          cargo test -Z build-std=std,panic_unwind,compiler_builtins
          -Z build-std-features=panic-unwind,backtrace-trace-only
          --locked --profile con-release-fast --target x86_64-pc-windows-msvc
          -p agenterm-con --test agenterm_con_throughput -- --ignored --nocapture
      - name: Test exact con profile
        run: >-
          cargo test -Z build-std=std,panic_unwind,compiler_builtins
          -Z build-std-features=panic-unwind,backtrace-trace-only
          --locked --profile con-release-fast --target x86_64-pc-windows-msvc
          -p agenterm-con
      - name: Build exact con artifact
        run: >-
          cargo build -Z build-std=std,panic_unwind,compiler_builtins
          -Z build-std-features=panic-unwind,backtrace-trace-only
          --locked --profile con-release-fast --target x86_64-pc-windows-msvc
          -p agenterm-con --bin agenterm-con

  target-cells:
    name: agenterm-con / ${{ matrix.cell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: win-aarch64
            runner: ubuntu-latest
            target: aarch64-pc-windows-msvc
            kind: xwin
          - cell: lnx-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            kind: native
          - cell: lnx-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            kind: linux-cross
          - cell: osx-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            kind: native
          - cell: osx-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            kind: native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - name: Install Windows cross tooling
        if: matrix.kind == 'xwin'
        run: cargo install cargo-xwin --locked
      - name: Install Linux aarch64 linker
        if: matrix.kind == 'linux-cross'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Check con through cargo-xwin
        if: matrix.kind == 'xwin'
        run: cargo xwin check --locked -p agenterm-con --all-targets --target ${{ matrix.target }}
      - name: Check con native/cross target
        if: matrix.kind != 'xwin'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --locked -p agenterm-con --all-targets --target ${{ matrix.target }}
      - name: Install Linux AT-SPI runtime
        if: matrix.cell == 'lnx-x86_64'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 libxkbcommon-x11-0 xvfb
      - name: Test real Linux AT-SPI con chrome
        if: matrix.cell == 'lnx-x86_64'
        env:
          AGENTERM_NO_ACTIVATE: "1"
        run: >-
          xvfb-run -a dbus-run-session --
          cargo test --locked -p agenterm-con
          --test agenterm_con_accessibility_linux -- --nocapture
