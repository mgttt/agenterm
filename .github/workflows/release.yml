name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release Candidate workflow run ID
        required: true
        type: string
      confirmation:
        description: Type publish-vX.Y.Z after reviewing the candidate
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      version: ${{ steps.bundle.outputs.version }}
      tag: ${{ steps.bundle.outputs.tag }}
    steps:
      - name: Resolve exact candidate run
        id: candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID"
          )"
          [[ "$(jq -r .path <<<"$run")" == \
            ".github/workflows/candidate.yml" ]]
          [[ "$(jq -r .event <<<"$run")" == "workflow_dispatch" ]]
          [[ "$(jq -r .status <<<"$run")" == "completed" ]]
          [[ "$(jq -r .conclusion <<<"$run")" == "success" ]]
          source_sha="$(jq -r .head_sha <<<"$run")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >>"$GITHUB_OUTPUT"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_path ".github/workflows/candidate.yml" \
            --arg event "workflow_dispatch" \
            --arg conclusion "success" \
            --arg source_sha "$source_sha" \
            --argjson run_id "$CANDIDATE_RUN_ID" \
            --argjson run_attempt "$(jq -r .run_attempt <<<"$run")" \
            '{
              schema_version: 1,
              repository: $repository,
              workflow_path: $workflow_path,
              event: $event,
              conclusion: $conclusion,
              source_sha: $source_sha,
              run_id: $run_id,
              run_attempt: $run_attempt
            }' >candidate-run-identity.json

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.candidate.outputs.source_sha }}

      - name: Download sealed candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir candidate
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "release-candidate-$CANDIDATE_RUN_ID" \
            --dir candidate
          cp candidate-run-identity.json candidate/

      - name: Extract candidate Script Runtime
        run: |
          set -euo pipefail
          archive="$(find candidate/payload -maxdepth 1 -type f \
            -name 'agenterm-*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/agenterm-promotion-tool"
          tar -xzf "$archive" -C "$RUNNER_TEMP/agenterm-promotion-tool"
          chmod +x "$RUNNER_TEMP/agenterm-promotion-tool/agenterm-script"

      - name: Verify candidate identity and every byte
        id: bundle
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="$(find candidate -maxdepth 1 -type f \
            -name 'agenterm-*-candidate-manifest.json' -print -quit)"
          test -n "$manifest"
          "$RUNNER_TEMP/agenterm-promotion-tool/agenterm-script" \
            run scripts/rhai/candidate-verify.rhai --project-root . -- \
            . "$manifest" candidate/payload
          version="$(jq -r .version "$manifest")"
          tag="$(jq -r .expected_tag "$manifest")"
          source_sha="$(jq -r .source_sha "$manifest")"
          [[ "$source_sha" == "${{ steps.candidate.outputs.source_sha }}" ]]
          [[ "$(jq -r .run.id "$manifest")" == \
            "$(jq -r .run_id candidate-run-identity.json)" ]]
          [[ "$(jq -r .run.attempt "$manifest")" == \
            "$(jq -r .run_attempt candidate-run-identity.json)" ]]
          [[ "$(jq -r .run.event "$manifest")" == \
            "$(jq -r .event candidate-run-identity.json)" ]]
          [[ "$tag" == "v$version" ]]
          [[ "$tag" != "v0.1.7" ]]
          [[ "$CONFIRMATION" == "publish-$tag" ]]
          cargo_version="$(
            sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1
          )"
          [[ "$version" == "$cargo_version" ]]
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" \
              >/dev/null 2>&1
          then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Upload verified promotion handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-promotion-${{ github.run_id }}
          path: candidate/
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.source_sha }}

      - name: Download verified promotion handoff
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: verified-promotion-${{ github.run_id }}
          path: candidate

      - name: Reverify promotion handoff
        run: |
          set -euo pipefail
          archive="$(find candidate/payload -maxdepth 1 -type f \
            -name 'agenterm-*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/agenterm-publish-tool"
          tar -xzf "$archive" -C "$RUNNER_TEMP/agenterm-publish-tool"
          chmod +x "$RUNNER_TEMP/agenterm-publish-tool/agenterm-script"
          "$RUNNER_TEMP/agenterm-publish-tool/agenterm-script" \
            run scripts/rhai/candidate-verify.rhai --project-root . -- \
            . \
            "$(find candidate -maxdepth 1 -type f \
              -name 'agenterm-*-candidate-manifest.json' -print -quit)" \
            candidate/payload

      - name: Create draft and publish immutable Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          manifest="$(
            find candidate -maxdepth 1 -type f \
              -name 'agenterm-*-candidate-manifest.json' -print -quit
          )"
          test -n "$manifest"
          mac_channel="$(
            jq -er '
              [.assets[] | select(.os == "macos") | .channel] |
              unique |
              if length == 1 then .[0]
              else error("candidate macOS channels are not unique")
              end
            ' "$manifest"
          )"
          preview_notice="$RUNNER_TEMP/macos-unsigned-preview-release-notice.md"
          if [[ "$mac_channel" == "macos-unsigned-preview" ]]; then
            cat >"$preview_notice" <<'EOF'
          <!-- agenterm-macos-unsigned-preview -->
          ## macOS unsigned preview — not the stable macOS channel

          Assets whose names end in `-macos-*-unsigned-preview.zip` are not
          signed with an Apple Developer ID and are not notarized by Apple.
          Verify the adjacent SHA-256 and provenance files, then read the
          downloadable `MACOS_UNSIGNED_PREVIEW_README.md` before opening.
          Do not disable Gatekeeper globally or recursively remove quarantine.
          <!-- /agenterm-macos-unsigned-preview -->
          EOF
          elif [[ "$mac_channel" != "release" ]]; then
            echo "Unexpected macOS Candidate channel: $mac_channel" >&2
            exit 1
          fi

          mapfile -d '' files < <(
            {
              find candidate/payload -maxdepth 1 -type f -print0
              printf '%s\0' "$manifest"
            } | sort -z
          )
          test "${#files[@]}" -gt 0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing Release $TAG." >&2
            exit 1
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SOURCE_SHA" >/dev/null
          actual_tag_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq .object.sha
          )"
          [[ "$actual_tag_sha" == "$SOURCE_SHA" ]]
          release_args=(
            --draft \
            --title "AgenTerm $TAG" \
            --generate-notes
            --verify-tag
          )
          if [[ "$mac_channel" == "macos-unsigned-preview" ]]; then
            release_args+=(--notes "$(cat "$preview_notice")")
          fi
          gh release create "$TAG" "${files[@]}" "${release_args[@]}"
          gh release edit "$TAG" --draft=false

      - name: Report promotion latency
        run: |
          {
            echo "## AgenTerm Release promotion"
            echo
            echo "- Candidate run: \`${{ inputs.candidate_run_id }}\`"
            echo "- Source: \`${{ needs.verify.outputs.source_sha }}\`"
            echo "- Tag: \`${{ needs.verify.outputs.tag }}\`"
            echo "- Promotion performs no Cargo build, test, package, signing,"
            echo "  notarization, or asset overwrite."
          } >>"$GITHUB_STEP_SUMMARY"
