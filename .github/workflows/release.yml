name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: windows-x86_64
            runner: windows-latest
            timeout_minutes: 45
          - platform_id: windows-aarch64
            runner: ubuntu-latest
            timeout_minutes: 45
          - platform_id: linux-x86_64
            runner: ubuntu-latest
            timeout_minutes: 30
          - platform_id: linux-aarch64
            runner: ubuntu-latest
            timeout_minutes: 30
          - platform_id: macos-aarch64
            runner: macos-latest
            timeout_minutes: 30
          - platform_id: macos-x86_64
            runner: macos-latest
            timeout_minutes: 30
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          import sys

          cargo = open("Cargo.toml", encoding="utf-8").read()
          match = re.search(
              r'(?ms)^\[package\].*?^version\s*=\s*"(?P<version>[^"]+)"',
              cargo,
          )
          if not match:
              sys.exit("Could not read Cargo.toml package version.")
          expected = f"v{match.group('version')}"
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != expected:
              sys.exit(f"Tag {tag} does not match {expected}.")
          if expected == "v0.1.7":
              sys.exit("v0.1.7 is an internal-only baseline and must not be published.")
          PY

      - name: Install lint components
        if: matrix.platform_id == 'windows-x86_64'
        run: rustup component add rustfmt clippy

      - name: Run release quality gate
        if: matrix.platform_id == 'windows-x86_64'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agenterm-release-check.log'
          try {
            $actualHead = (git rev-parse HEAD).Trim()
            if ($actualHead -ne $env:GITHUB_SHA) {
              throw "Checked-out HEAD $actualHead does not match event SHA $env:GITHUB_SHA."
            }
            git switch -C main $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Could not attach the tagged commit to the local main branch."
            }
            ./check.ps1 -Release -IncludeStress *>&1 | Tee-Object -LiteralPath $log
            if ($LASTEXITCODE -ne 0) {
              throw "Release quality gate failed with exit code $LASTEXITCODE."
            }
          }
          catch {
            $errorText = $_ | Out-String
            $errorText | Add-Content -LiteralPath $log
            Write-Host $errorText
            throw
          }

      - name: Upload failed quality-gate diagnostics
        if: failure() && matrix.platform_id == 'windows-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-quality-gate-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/agenterm-release-check.log
            ${{ runner.temp }}/agenterm-theme-*.png
            ${{ runner.temp }}/agenterm-proxy-eye-*.png
            target/smoke/*.png

      - name: Package Windows x86_64 release
        if: matrix.platform_id == 'windows-x86_64'
        shell: pwsh
        run: |
          . ./scripts/artifact-manifest.ps1
          $artifactSpec = Get-AgenTermArtifactManifest `
            -Path ./scripts/artifacts.json
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $zip = "./dist/agenterm-$version-windows-x86_64.zip"
          $metadata = Get-Content ./dist/agenterm.json -Raw |
            ConvertFrom-Json
          if ($metadata.version -ne $version) {
            throw "Build metadata version $($metadata.version) does not match $version."
          }
          $expectedNames = @($artifactSpec.executables.name)
          $metadataNames = @($metadata.executables.name)
          if (Compare-Object $expectedNames $metadataNames) {
            throw 'Build metadata does not contain the expected release executable names.'
          }
          $artifactManifestHash = (
            Get-FileHash ./scripts/artifacts.json -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($metadata.artifact_manifest_sha256 -ne $artifactManifestHash) {
            throw 'Build metadata does not match the release artifact manifest.'
          }
          foreach ($entry in $metadata.executables) {
            $path = Join-Path ./dist $entry.name
            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $entry.sha256) {
              throw "SHA-256 mismatch for $($entry.name)."
            }
          }
          $packageFiles = @(
            $artifactSpec.executables |
              ForEach-Object { Join-Path ./dist $_.name }
          ) + @(
            './dist/agenterm.json'
            './scripts/artifacts.json'
            './LICENSE-APACHE'
            './LICENSE-MIT'
            './THIRD_PARTY_NOTICES.md'
          )
          Compress-Archive `
            -LiteralPath $packageFiles `
            -DestinationPath $zip

      - name: Install Windows ARM64 cross-build tooling
        if: matrix.platform_id == 'windows-aarch64'
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo install cargo-xwin --locked

      - name: Build Windows ARM64 release
        if: matrix.platform_id == 'windows-aarch64'
        env:
          AGENTERM_BUILD_PROFILE: release
        run: ./scripts/build-windows-arm64.sh

      - name: Package Windows ARM64 release
        if: matrix.platform_id == 'windows-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BIN_DIR="target/aarch64-pc-windows-msvc/release"
          STAGING="$(mktemp -d)"
          mkdir -p dist
          mapfile -t EXEC_NAMES < <(
            python3 - ./scripts/artifacts.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          platform = next(
              entry
              for entry in manifest["platforms"]
              if entry["os"] == "windows" and entry["arch"] == "aarch64"
          )
          for executable in platform["executables"]:
              print(executable["name"])
          PY
          )
          for name in "${EXEC_NAMES[@]}"; do
            cp "$BIN_DIR/$name" "$STAGING/$name"
          done
          cp LICENSE-APACHE LICENSE-MIT THIRD_PARTY_NOTICES.md ./scripts/artifacts.json "$STAGING/"
          (cd "$STAGING" && zip -r "$GITHUB_WORKSPACE/dist/agenterm-${VERSION}-windows-aarch64.zip" .)

      - name: Build Linux x86_64 clients
        if: matrix.platform_id == 'linux-x86_64'
        env:
          AGENTERM_BUILD_PROFILE: release
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libwayland-client0
          ./scripts/build-linux-clients.sh

      - name: Package Linux x86_64 release
        if: matrix.platform_id == 'linux-x86_64'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/package-client-release.sh \
            "$VERSION" linux x86_64 target/x86_64-unknown-linux-gnu/release

      - name: Install Linux ARM64 cross linker
        if: matrix.platform_id == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libxkbcommon0 libxkbcommon-x11-0
          rustup target add aarch64-unknown-linux-gnu

      - name: Build Linux ARM64 clients
        if: matrix.platform_id == 'linux-aarch64'
        env:
          AGENTERM_BUILD_PROFILE: release
        run: ./scripts/build-linux-aarch64-clients.sh

      - name: Package Linux ARM64 release
        if: matrix.platform_id == 'linux-aarch64'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/package-client-release.sh \
            "$VERSION" linux aarch64 target/aarch64-unknown-linux-gnu/release

      - name: Build macOS ARM64 clients
        if: matrix.platform_id == 'macos-aarch64'
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin \
            --bin agenterm --bin agenterm-cli --bin agenterm-mux --bin agenterm-script

      - name: Package macOS ARM64 release
        if: matrix.platform_id == 'macos-aarch64'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/package-client-release.sh \
            "$VERSION" macos aarch64 target/aarch64-apple-darwin/release

      - name: Build macOS x86_64 clients
        if: matrix.platform_id == 'macos-x86_64'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin \
            --bin agenterm --bin agenterm-cli --bin agenterm-mux --bin agenterm-script

      - name: Package macOS x86_64 release
        if: matrix.platform_id == 'macos-x86_64'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/package-client-release.sh \
            "$VERSION" macos x86_64 target/x86_64-apple-darwin/release

      - name: Upload Windows x86_64 release assets
        if: matrix.platform_id == 'windows-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-x86_64
          path: dist/agenterm-*-windows-x86_64.zip

      - name: Upload Windows ARM64 release assets
        if: matrix.platform_id == 'windows-aarch64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-aarch64
          path: dist/agenterm-*-windows-aarch64.zip

      - name: Upload Linux x86_64 release assets
        if: matrix.platform_id == 'linux-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-x86_64
          path: dist/agenterm-*-linux-x86_64.tar.gz

      - name: Upload Linux ARM64 release assets
        if: matrix.platform_id == 'linux-aarch64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-aarch64
          path: dist/agenterm-*-linux-aarch64.tar.gz

      - name: Upload macOS ARM64 release assets
        if: matrix.platform_id == 'macos-aarch64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-aarch64
          path: dist/agenterm-*-macos-aarch64.tar.gz

      - name: Upload macOS x86_64 release assets
        if: matrix.platform_id == 'macos-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-x86_64
          path: dist/agenterm-*-macos-x86_64.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f -print0 | sort -z)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --draft=false \
              --title "AgenTerm $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag \
              --generate-notes \
              --title "AgenTerm $GITHUB_REF_NAME"
          fi
