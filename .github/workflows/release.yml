name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release Candidate workflow run ID
        required: true
        type: string
      confirmation:
        description: Type publish-vX.Y.Z after reviewing the candidate
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      version: ${{ steps.bundle.outputs.version }}
      tag: ${{ steps.bundle.outputs.tag }}
    steps:
      - name: Resolve exact candidate run
        id: candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID"
          )"
          [[ "$(jq -r .path <<<"$run")" == \
            ".github/workflows/candidate.yml" ]]
          [[ "$(jq -r .event <<<"$run")" == "workflow_dispatch" ]]
          [[ "$(jq -r .status <<<"$run")" == "completed" ]]
          [[ "$(jq -r .conclusion <<<"$run")" == "success" ]]
          source_sha="$(jq -r .head_sha <<<"$run")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >>"$GITHUB_OUTPUT"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_path ".github/workflows/candidate.yml" \
            --arg event "workflow_dispatch" \
            --arg conclusion "success" \
            --arg source_sha "$source_sha" \
            --argjson run_id "$CANDIDATE_RUN_ID" \
            --argjson run_attempt "$(jq -r .run_attempt <<<"$run")" \
            '{
              schema_version: 1,
              repository: $repository,
              workflow_path: $workflow_path,
              event: $event,
              conclusion: $conclusion,
              source_sha: $source_sha,
              run_id: $run_id,
              run_attempt: $run_attempt
            }' >candidate-run-identity.json

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.candidate.outputs.source_sha }}

      - name: Download sealed candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir candidate
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "release-candidate-$CANDIDATE_RUN_ID" \
            --dir candidate
          cp candidate-run-identity.json candidate/

      - name: Extract candidate Script Runtime
        run: |
          set -euo pipefail
          archive="$(find candidate/payload -maxdepth 1 -type f \
            -name 'agenterm-*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/agenterm-promotion-tool"
          tar -xzf "$archive" -C "$RUNNER_TEMP/agenterm-promotion-tool"
          chmod +x "$RUNNER_TEMP/agenterm-promotion-tool/agenterm-script"

      - name: Verify candidate identity and every byte
        id: bundle
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="$(find candidate -maxdepth 1 -type f \
            -name 'agenterm-*-candidate-manifest.json' -print -quit)"
          test -n "$manifest"
          "$RUNNER_TEMP/agenterm-promotion-tool/agenterm-script" \
            run scripts/rhai/candidate-verify.rhai --project-root . -- \
            . "$manifest" candidate/payload
          version="$(jq -r .version "$manifest")"
          tag="$(jq -r .expected_tag "$manifest")"
          source_sha="$(jq -r .source_sha "$manifest")"
          [[ "$source_sha" == "${{ steps.candidate.outputs.source_sha }}" ]]
          [[ "$(jq -r .run.id "$manifest")" == \
            "$(jq -r .run_id candidate-run-identity.json)" ]]
          [[ "$(jq -r .run.attempt "$manifest")" == \
            "$(jq -r .run_attempt candidate-run-identity.json)" ]]
          [[ "$(jq -r .run.event "$manifest")" == \
            "$(jq -r .event candidate-run-identity.json)" ]]
          [[ "$tag" == "v$version" ]]
          [[ "$tag" != "v0.1.7" ]]
          [[ "$CONFIRMATION" == "publish-$tag" ]]
          cargo_version="$(
            sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1
          )"
          [[ "$version" == "$cargo_version" ]]
          "$RUNNER_TEMP/agenterm-promotion-tool/agenterm-script" \
            run scripts/rhai/promotion-identity.rhai --project-root . -- \
            "$manifest" "$CANDIDATE_RUN_ID" "$source_sha" \
            candidate/promotion-identity.json >/dev/null
          identity="candidate/promotion-identity.json"
          marker="$(jq -r .marker "$identity")"
          release_body="$(jq -r .body "$identity")"
          find_release_by_tag() {
            local wanted="$1"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -cr --arg wanted "$wanted" '
                [.[][] | select(.tag_name == $wanted)] |
                if length == 0 then null
                elif length == 1 then .[0]
                else error("duplicate releases for tag")
                end
              '
          }
          tag_sha="$(
            git ls-remote --refs --tags origin "refs/tags/$tag" |
              awk 'NR == 1 {print $1}'
          )"
          if [[ -n "$tag_sha" && "$tag_sha" != "$source_sha" ]]; then
            echo "Release tag $tag points to unexpected SHA $tag_sha." >&2
            exit 1
          fi
          release="$(find_release_by_tag "$tag")"
          if [[ "$release" != "null" ]]; then
            if [[ "$(jq -r .draft <<<"$release")" != "true" ]]; then
              echo "Published GitHub Release already exists: $tag" >&2
              exit 1
            fi
            [[ "$(jq -r .tag_name <<<"$release")" == "$tag" ]]
            [[ "$(jq -r .name <<<"$release")" == "AgenTerm $tag" ]]
            [[ "$(jq -r .body <<<"$release")" == "$release_body" ]]
            if [[ -z "$tag_sha" ]]; then
              [[ "$(jq -r .target_commitish <<<"$release")" == \
                "$source_sha" ]]
            fi
            echo "Recovering exact unpublished draft for $tag."
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Upload verified promotion handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-promotion-${{ github.run_id }}
          path: candidate/
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.source_sha }}

      - name: Download verified promotion handoff
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: verified-promotion-${{ github.run_id }}
          path: candidate

      - name: Reverify promotion handoff
        run: |
          set -euo pipefail
          archive="$(find candidate/payload -maxdepth 1 -type f \
            -name 'agenterm-*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/agenterm-publish-tool"
          tar -xzf "$archive" -C "$RUNNER_TEMP/agenterm-publish-tool"
          chmod +x "$RUNNER_TEMP/agenterm-publish-tool/agenterm-script"
          "$RUNNER_TEMP/agenterm-publish-tool/agenterm-script" \
            run scripts/rhai/candidate-verify.rhai --project-root . -- \
            . \
            "$(find candidate -maxdepth 1 -type f \
              -name 'agenterm-*-candidate-manifest.json' -print -quit)" \
            candidate/payload

      - name: Create draft and publish immutable Release
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          manifest="$(
            find candidate -maxdepth 1 -type f \
              -name 'agenterm-*-candidate-manifest.json' -print -quit
          )"
          test -n "$manifest"
          identity="candidate/promotion-identity.json"
          test -f "$identity"
          [[ "$(jq -r .schema_version "$identity")" == "1" ]]
          [[ "$(jq -r .kind "$identity")" == \
            "agenterm-promotion-identity" ]]
          [[ "$(jq -r .candidate_run_id "$identity")" == \
            "$CANDIDATE_RUN_ID" ]]
          [[ "$(jq -r .source_sha "$identity")" == "$SOURCE_SHA" ]]
          [[ "$(jq -r .version "$identity")" == "$VERSION" ]]
          [[ "$(jq -r .tag "$identity")" == "$TAG" ]]
          manifest_sha256="$(sha256sum "$manifest" | cut -d' ' -f1)"
          [[ "$(jq -r .manifest_sha256 "$identity")" == \
            "$manifest_sha256" ]]
          marker="$(jq -r .marker "$identity")"
          release_body="$(jq -r .body "$identity")"
          body_sha256="$(
            printf '%s' "$release_body" | sha256sum | cut -d' ' -f1
          )"
          [[ "$(jq -r .body_sha256 "$identity")" == "$body_sha256" ]]
          identity_mac_channel="$(jq -r .mac_channel "$identity")"
          expected_marker="<!-- agenterm-promotion:v1 candidate_run_id=$CANDIDATE_RUN_ID source_sha=$SOURCE_SHA manifest_sha256=$manifest_sha256 mac_channel=$identity_mac_channel -->"
          [[ "$marker" == "$expected_marker" ]]
          mac_channel="$(
            jq -er '
              [.assets[] | select(.os == "macos") | .channel] |
              unique |
              if length == 1 then .[0]
              else error("candidate macOS channels are not unique")
              end
            ' "$manifest"
          )"
          [[ "$identity_mac_channel" == "$mac_channel" ]]
          if [[ "$mac_channel" == "macos-unsigned-preview" ]]; then
            [[ "$release_body" == *"macOS unsigned preview"* ]]
            [[ "$release_body" == *"MACOS_UNSIGNED_PREVIEW_README.md"* ]]
          elif [[ "$mac_channel" != "release" ]]; then
            echo "Unexpected macOS Candidate channel: $mac_channel" >&2
            exit 1
          fi

          mapfile -d '' files < <(
            {
              find candidate/payload -maxdepth 1 -type f -print0
              printf '%s\0' "$manifest"
            } | sort -z
          )
          test "${#files[@]}" -gt 0
          find_release_by_tag() {
            local wanted="$1"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -cr --arg wanted "$wanted" '
                [.[][] | select(.tag_name == $wanted)] |
                if length == 0 then null
                elif length == 1 then .[0]
                else error("duplicate releases for tag")
                end
              '
          }
          if actual_tag_sha="$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                --jq .object.sha 2>/dev/null
            )"
          then
            [[ "$actual_tag_sha" == "$SOURCE_SHA" ]]
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$SOURCE_SHA" >/dev/null
            actual_tag_sha="$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                --jq .object.sha
            )"
          fi
          [[ "$actual_tag_sha" == "$SOURCE_SHA" ]]

          release_args=(
            --draft \
            --title "AgenTerm $TAG" \
            --verify-tag
            --notes "$release_body"
          )

          release="$(find_release_by_tag "$TAG")"
          if [[ "$release" != "null" ]]; then
            [[ "$(jq -r .draft <<<"$release")" == "true" ]]
            [[ "$(jq -r .tag_name <<<"$release")" == "$TAG" ]]
            [[ "$(jq -r .name <<<"$release")" == "AgenTerm $TAG" ]]
            [[ "$(jq -r .body <<<"$release")" == "$release_body" ]]
          else
            gh release create "$TAG" "${release_args[@]}"
            release="$(find_release_by_tag "$TAG")"
            [[ "$release" != "null" ]]
            [[ "$(jq -r .draft <<<"$release")" == "true" ]]
            [[ "$(jq -r .name <<<"$release")" == "AgenTerm $TAG" ]]
            [[ "$(jq -r .body <<<"$release")" == "$release_body" ]]
          fi

          find_local_asset() {
            local wanted="$1"
            local candidate
            LOCAL_ASSET=""
            for candidate in "${files[@]}"; do
              if [[ "$(basename "$candidate")" == "$wanted" ]]; then
                [[ -z "$LOCAL_ASSET" ]]
                LOCAL_ASSET="$candidate"
              fi
            done
            [[ -n "$LOCAL_ASSET" ]]
          }

          verify_remote_assets() {
            local release_json="$1"
            local id name size digest local_size local_hash remote_hash
            local remote_file
            local count=0
            while IFS=$'\t' read -r id name size digest; do
              [[ -n "$id" ]]
              find_local_asset "$name"
              local_size="$(stat -c %s "$LOCAL_ASSET")"
              [[ "$size" == "$local_size" ]]
              local_hash="$(sha256sum "$LOCAL_ASSET" | cut -d' ' -f1)"
              remote_hash="${digest#sha256:}"
              if [[ ! "$remote_hash" =~ ^[0-9a-f]{64}$ ]]; then
                remote_file="$RUNNER_TEMP/release-asset-$id"
                gh api \
                  -H "Accept: application/octet-stream" \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
                  >"$remote_file"
                remote_hash="$(
                  sha256sum "$remote_file" | cut -d' ' -f1
                )"
                rm -f "$remote_file"
              fi
              [[ "$remote_hash" == "$local_hash" ]]
              count=$((count + 1))
            done < <(
              jq -r '
                .assets[] |
                [.id, .name, .size, (.digest // "")] |
                @tsv
              ' <<<"$release_json"
            )
            REMOTE_ASSET_COUNT="$count"
          }

          verify_remote_assets "$release"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            if ! jq -e --arg name "$name" \
                '.assets[] | select(.name == $name)' \
                <<<"$release" >/dev/null
            then
              gh release upload "$TAG" "$file"
            fi
          done

          release="$(find_release_by_tag "$TAG")"
          [[ "$release" != "null" ]]
          [[ "$(jq -r .draft <<<"$release")" == "true" ]]
          [[ "$(jq -r .name <<<"$release")" == "AgenTerm $TAG" ]]
          [[ "$(jq -r .body <<<"$release")" == "$release_body" ]]
          verify_remote_assets "$release"
          [[ "$REMOTE_ASSET_COUNT" == "${#files[@]}" ]]
          gh release edit "$TAG" --draft=false

      - name: Report promotion latency
        run: |
          {
            echo "## AgenTerm Release promotion"
            echo
            echo "- Candidate run: \`${{ inputs.candidate_run_id }}\`"
            echo "- Source: \`${{ needs.verify.outputs.source_sha }}\`"
            echo "- Tag: \`${{ needs.verify.outputs.tag }}\`"
            echo "- Promotion performs no Cargo build, test, package, signing,"
            echo "  notarization, or asset overwrite."
          } >>"$GITHUB_STEP_SUMMARY"
