name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: windows-x86_64
            runner: windows-latest
            timeout_minutes: 45
          - platform_id: windows-aarch64
            runner: ubuntu-latest
            timeout_minutes: 45
          - platform_id: linux-x86_64
            runner: ubuntu-latest
            timeout_minutes: 30
          - platform_id: linux-aarch64
            runner: ubuntu-latest
            timeout_minutes: 30
          - platform_id: macos-aarch64
            runner: macos-latest
            timeout_minutes: 30
          - platform_id: macos-x86_64
            runner: macos-latest
            timeout_minutes: 30
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          import sys

          cargo = open("Cargo.toml", encoding="utf-8").read()
          match = re.search(
              r'(?ms)^\[package\].*?^version\s*=\s*"(?P<version>[^"]+)"',
              cargo,
          )
          if not match:
              sys.exit("Could not read Cargo.toml package version.")
          expected = f"v{match.group('version')}"
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != expected:
              sys.exit(f"Tag {tag} does not match {expected}.")
          if expected == "v0.1.7":
              sys.exit("v0.1.7 is an internal-only baseline and must not be published.")
          PY

      - name: Install lint components
        if: matrix.platform_id == 'windows-x86_64'
        run: rustup component add rustfmt clippy

      - name: Run release quality gate
        if: matrix.platform_id == 'windows-x86_64'
        shell: cmd
        run: |
          @echo off
          set "LOG=%RUNNER_TEMP%\agenterm-release-check.log"
          for /f "delims=" %%H in ('git rev-parse HEAD') do set "ACTUAL_HEAD=%%H"
          if /I not "%ACTUAL_HEAD%"=="%GITHUB_SHA%" (
            echo Checked-out HEAD %ACTUAL_HEAD% does not match event SHA %GITHUB_SHA%. > "%LOG%"
            type "%LOG%"
            exit /b 1
          )
          git switch -C main "%GITHUB_SHA%" > "%LOG%" 2>&1
          if errorlevel 1 (
            type "%LOG%"
            exit /b 1
          )
          call check.cmd --release --include-stress >> "%LOG%" 2>&1
          set "CHECK_EXIT=%ERRORLEVEL%"
          type "%LOG%"
          exit /b %CHECK_EXIT%

      - name: Upload failed quality-gate diagnostics
        if: failure() && matrix.platform_id == 'windows-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-quality-gate-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/agenterm-release-check.log
            ${{ runner.temp }}/agenterm-theme-*.png
            ${{ runner.temp }}/agenterm-proxy-eye-*.png
            target/smoke/*.png

      - name: Package Windows x86_64 release
        if: matrix.platform_id == 'windows-x86_64'
        shell: cmd
        run: >-
          dist\agenterm-script.exe task run package-release-qualified
          --manifest agenterm.tasks.json

      - name: Install Windows ARM64 cross-build tooling
        if: matrix.platform_id == 'windows-aarch64'
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo install cargo-xwin --locked

      - name: Build Windows ARM64 release
        if: matrix.platform_id == 'windows-aarch64'
        env:
          AGENTERM_BOOTSTRAP_TASK: client-build
        run: >-
          ./scripts/bootstrap.sh release
          --target aarch64-pc-windows-msvc --driver cargo-xwin

      - name: Package Windows ARM64 release
        if: matrix.platform_id == 'windows-aarch64'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bootstrap.sh "$VERSION" windows aarch64 \
            target/aarch64-pc-windows-msvc/release

      - name: Build Linux x86_64 clients
        if: matrix.platform_id == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libwayland-client0
          AGENTERM_BOOTSTRAP_TASK=client-build \
            ./scripts/bootstrap.sh release \
            --target x86_64-unknown-linux-gnu

      - name: Package Linux x86_64 release
        if: matrix.platform_id == 'linux-x86_64'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bootstrap.sh \
            "$VERSION" linux x86_64 target/x86_64-unknown-linux-gnu/release

      - name: Install Linux ARM64 cross linker
        if: matrix.platform_id == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libxkbcommon0 libxkbcommon-x11-0
          rustup target add aarch64-unknown-linux-gnu

      - name: Build Linux ARM64 clients
        if: matrix.platform_id == 'linux-aarch64'
        env:
          AGENTERM_BOOTSTRAP_TASK: client-build
        run: >-
          ./scripts/bootstrap.sh release
          --target aarch64-unknown-linux-gnu

      - name: Package Linux ARM64 release
        if: matrix.platform_id == 'linux-aarch64'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bootstrap.sh \
            "$VERSION" linux aarch64 target/aarch64-unknown-linux-gnu/release

      - name: Import Apple Developer ID credentials
        if: >-
          startsWith(matrix.platform_id, 'macos-') &&
          vars.ENABLE_SIGNED_MACOS_RELEASE == 'true'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_KEY_P8_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Required macOS release secret is missing: $name" >&2
              exit 1
            fi
          done

          CERTIFICATE_PATH="$RUNNER_TEMP/agenterm-developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          python3 - "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          certificate_path, notary_key_path = map(pathlib.Path, sys.argv[1:3])
          certificate_path.write_bytes(
              base64.b64decode(
                  "".join(os.environ["APPLE_DEVELOPER_ID_P12_BASE64"].split()),
                  validate=True,
              )
          )
          notary_key_path.write_bytes(
              base64.b64decode(
                  "".join(os.environ["APPLE_NOTARY_KEY_P8_BASE64"].split()),
                  validate=True,
              )
          )
          PY

          KEYCHAIN_PATH="$RUNNER_TEMP/agenterm-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
              sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' |
              head -n 1
          )"
          if [[ -z "$IDENTITY" ]]; then
            echo "Imported certificate is not a Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Report macOS unsigned preview channel
        if: >-
          startsWith(matrix.platform_id, 'macos-') &&
          vars.ENABLE_SIGNED_MACOS_RELEASE != 'true'
        run: |
          echo "Signed macOS stable publishing is disabled; this job will produce a visibly labeled unsigned preview."
          echo "Set ENABLE_SIGNED_MACOS_RELEASE=true only after all Developer ID and notarization secrets are configured."

      - name: Build macOS ARM64 clients
        if: matrix.platform_id == 'macos-aarch64'
        run: |
          rustup target add aarch64-apple-darwin
          AGENTERM_BOOTSTRAP_TASK=client-build \
            ./scripts/bootstrap.sh release --target aarch64-apple-darwin

      - name: Sign macOS ARM64 clients
        if: >-
          matrix.platform_id == 'macos-aarch64' &&
          vars.ENABLE_SIGNED_MACOS_RELEASE == 'true'
        run: |
          ./scripts/sign-macos-release.sh \
            aarch64 target/aarch64-apple-darwin/release

      - name: Package macOS ARM64 release
        if: >-
          matrix.platform_id == 'macos-aarch64' &&
          vars.ENABLE_SIGNED_MACOS_RELEASE == 'true'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bootstrap.sh \
            "$VERSION" macos aarch64 target/aarch64-apple-darwin/release --signed

      - name: Notarize macOS ARM64 release
        if: >-
          matrix.platform_id == 'macos-aarch64' &&
          vars.ENABLE_SIGNED_MACOS_RELEASE == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/agenterm-${VERSION}-macos-aarch64.zip"
          RESULT="$(
            xcrun notarytool submit "$ARCHIVE" \
              --key "$APPLE_NOTARY_KEY_PATH" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --wait \
              --output-format json
          )"
          echo "$RESULT"
          RESULT="$RESULT" python3 - <<'PY'
          import json
          import os
          import sys

          result = json.loads(os.environ["RESULT"])
          if result.get("status") != "Accepted":
              sys.exit(f"Apple notarization was not accepted: {result}")
          PY

      - name: Package macOS ARM64 unsigned preview
        if: >-
          matrix.platform_id == 'macos-aarch64' &&
          vars.ENABLE_SIGNED_MACOS_RELEASE != 'true'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bootstrap.sh "$VERSION" macos aarch64 \
            target/aarch64-apple-darwin/release --unsigned-preview

      - name: Build macOS x86_64 clients
        if: matrix.platform_id == 'macos-x86_64'
        run: |
          rustup target add x86_64-apple-darwin
          AGENTERM_BOOTSTRAP_TASK=client-build \
            ./scripts/bootstrap.sh release --target x86_64-apple-darwin

      - name: Sign macOS x86_64 clients
        if: >-
          matrix.platform_id == 'macos-x86_64' &&
          vars.ENABLE_SIGNED_MACOS_RELEASE == 'true'
        run: |
          ./scripts/sign-macos-release.sh \
            x86_64 target/x86_64-apple-darwin/release

      - name: Package macOS x86_64 release
        if: >-
          matrix.platform_id == 'macos-x86_64' &&
          vars.ENABLE_SIGNED_MACOS_RELEASE == 'true'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bootstrap.sh \
            "$VERSION" macos x86_64 target/x86_64-apple-darwin/release --signed

      - name: Notarize macOS x86_64 release
        if: >-
          matrix.platform_id == 'macos-x86_64' &&
          vars.ENABLE_SIGNED_MACOS_RELEASE == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/agenterm-${VERSION}-macos-x86_64.zip"
          RESULT="$(
            xcrun notarytool submit "$ARCHIVE" \
              --key "$APPLE_NOTARY_KEY_PATH" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --wait \
              --output-format json
          )"
          echo "$RESULT"
          RESULT="$RESULT" python3 - <<'PY'
          import json
          import os
          import sys

          result = json.loads(os.environ["RESULT"])
          if result.get("status") != "Accepted":
              sys.exit(f"Apple notarization was not accepted: {result}")
          PY

      - name: Package macOS x86_64 unsigned preview
        if: >-
          matrix.platform_id == 'macos-x86_64' &&
          vars.ENABLE_SIGNED_MACOS_RELEASE != 'true'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bootstrap.sh "$VERSION" macos x86_64 \
            target/x86_64-apple-darwin/release --unsigned-preview

      - name: Upload Windows x86_64 release assets
        if: matrix.platform_id == 'windows-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-x86_64
          path: |
            dist/agenterm-*-windows-x86_64.zip
            dist/agenterm-*-sbom.spdx.json

      - name: Upload Windows ARM64 release assets
        if: matrix.platform_id == 'windows-aarch64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-aarch64
          path: dist/agenterm-*-windows-aarch64.zip*

      - name: Upload Linux x86_64 release assets
        if: matrix.platform_id == 'linux-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-x86_64
          path: dist/agenterm-*-linux-x86_64.tar.gz*

      - name: Upload Linux ARM64 release assets
        if: matrix.platform_id == 'linux-aarch64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-aarch64
          path: dist/agenterm-*-linux-aarch64.tar.gz*

      - name: Upload macOS ARM64 release assets
        if: >-
          matrix.platform_id == 'macos-aarch64' &&
          vars.ENABLE_SIGNED_MACOS_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-aarch64
          path: dist/agenterm-*-macos-aarch64.zip*

      - name: Upload macOS x86_64 release assets
        if: >-
          matrix.platform_id == 'macos-x86_64' &&
          vars.ENABLE_SIGNED_MACOS_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-x86_64
          path: dist/agenterm-*-macos-x86_64.zip*

      - name: Upload macOS ARM64 unsigned preview assets
        if: >-
          matrix.platform_id == 'macos-aarch64' &&
          vars.ENABLE_SIGNED_MACOS_RELEASE != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-aarch64-unsigned-preview
          path: |
            dist/agenterm-*-macos-aarch64-unsigned-preview.zip*
            dist/MACOS_UNSIGNED_PREVIEW_README*.md

      - name: Upload macOS x86_64 unsigned preview assets
        if: >-
          matrix.platform_id == 'macos-x86_64' &&
          vars.ENABLE_SIGNED_MACOS_RELEASE != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-x86_64-unsigned-preview
          path: dist/agenterm-*-macos-x86_64-unsigned-preview.zip*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f -print0 | sort -z)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          release_title="AgenTerm $GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" == "v0.1.9+hotfix.1" ]]; then
            release_title="AgenTerm v0.1.9.1 Hotfix"
          fi
          preview_notice="$RUNNER_TEMP/macos-unsigned-preview-release-notice.md"
          has_macos_preview=false
          if find release-assets -type f \
              -name '*-macos-*-unsigned-preview.zip' -print -quit |
              grep -q .
          then
            has_macos_preview=true
            cat >"$preview_notice" <<'EOF'
          <!-- agenterm-macos-unsigned-preview -->
          ## macOS unsigned preview — not the stable macOS channel

          Assets whose names end in `-macos-*-unsigned-preview.zip` are **not
          signed with an Apple Developer ID and are not notarized by Apple**.
          They are intended for developers and voluntary preview testers.

          Before opening one, download its adjacent `.sha256` and
          `.provenance.json` files and verify:

          ```sh
          shasum -a 256 -c agenterm-*-macos-*-unsigned-preview.zip.sha256
          ```

          The Release also includes a versioned SPDX dependency inventory.
          After one blocked launch attempt, a user who has verified the source
          and accepts the risk can use **System Settings → Privacy & Security →
          Open Anyway**. Read the downloadable
          `MACOS_UNSIGNED_PREVIEW_README.md` first.
          A Traditional Chinese copy is available as
          `MACOS_UNSIGNED_PREVIEW_README.zh-Hant.md`.

          Do not disable Gatekeeper globally, do not run
          `spctl --master-disable`, and do not recursively remove quarantine
          attributes. Signed/notarized macOS stable releases remain disabled
          until the Apple distribution credentials are available.
          <!-- /agenterm-macos-unsigned-preview -->
          EOF
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            if [[ "$has_macos_preview" == true ]]; then
              existing_body="$(
                gh release view "$GITHUB_REF_NAME" --json body --jq .body
              )"
              if [[ "$existing_body" != *"agenterm-macos-unsigned-preview"* ]]; then
                {
                  cat "$preview_notice"
                  printf '\n%s\n' "$existing_body"
                } >"$RUNNER_TEMP/release-notes.md"
                gh release edit "$GITHUB_REF_NAME" \
                  --notes-file "$RUNNER_TEMP/release-notes.md"
              fi
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --draft=false \
              --title "$release_title"
          else
            if [[ "$has_macos_preview" == true ]]; then
              gh release create "$GITHUB_REF_NAME" "${files[@]}" \
                --verify-tag \
                --generate-notes \
                --notes "$(cat "$preview_notice")" \
                --title "$release_title"
            else
              gh release create "$GITHUB_REF_NAME" "${files[@]}" \
                --verify-tag \
                --generate-notes \
                --title "$release_title"
            fi
          fi
