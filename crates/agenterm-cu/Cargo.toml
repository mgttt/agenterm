[package]
name = "agenterm-cu"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Agenterm computer-use foundation: abstract command surface over agenterm-platform"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgttt/agenterm"

[dependencies]
agenterm-platform = { path = "../agenterm-platform", default-features = false, features = ["serde", "window-enum", "window-op", "input-inject", "screenshot"] }
agenterm-abi = { path = "../agenterm-abi", features = ["allow-abort-profile"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "cu"
path = "src/bin/cu.rs"
