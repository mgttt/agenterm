[package]
name = "agenterm-cu"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Agenterm computer-use foundation: abstract command surface over the shared libagenterm dynamic library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgttt/agenterm"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Milestone 46: both `cu` and `agenterm-cu` REALLY load the libagenterm
# dynamic library at run time (dlopen / LoadLibrary) through the shared
# `crate::dynlib` layer. The former platform/abi static dependencies are
# gone entirely.
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = [
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.2.2", features = [
    "NSDictionary",
    "NSValue",
] }

[[bin]]
name = "cu"
path = "src/bin/cu.rs"

# Milestone 44: runtime dynamic-library demo binary. Loads libagenterm via
# dlopen / LoadLibrary and exercises a read-only subset of the agt_* exports.
[[bin]]
name = "agenterm-cu"
path = "src/bin/agenterm_cu.rs"
