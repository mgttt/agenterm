[package]
name = "agenterm-cu"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Agenterm computer-use foundation: abstract command surface over agenterm-platform"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgttt/agenterm"

[dependencies]
agenterm-platform = { path = "../agenterm-platform", default-features = false, features = ["serde", "window-enum", "window-op", "input-inject", "screenshot", "a11y-tree"] }
agenterm-abi = { path = "../agenterm-abi", features = ["allow-abort-profile"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Milestone 44: `agenterm-cu` must REALLY load the libagenterm dynamic
# library at run time (dlopen / LoadLibrary). This is a production
# dependency of the new bin only — the existing `cu` bin is untouched.
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = [
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.2.2", features = [
    "NSDictionary",
    "NSValue",
] }

[[bin]]
name = "cu"
path = "src/bin/cu.rs"

# Milestone 44: runtime dynamic-library demo binary. Loads libagenterm via
# dlopen / LoadLibrary and exercises a read-only subset of the agt_* exports.
[[bin]]
name = "agenterm-cu"
path = "src/bin/agenterm_cu.rs"
