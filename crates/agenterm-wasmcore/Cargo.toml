# Standalone by design, not a root-workspace member: `[workspace]` below is
# an empty table so Cargo treats this directory as its own workspace root
# instead of walking up to `D:\dev\agenterm\Cargo.toml` and erroring with
# "current package believes it's in a workspace when it's not" (verified —
# that is the real error hit before this table was added). Mirrors how
# `agenterm-nativecore`/`agenterm-dynacore`/`agenterm-guestcore` are kept out
# of the root workspace's `members` list (see `git log -- Cargo.toml`,
# commit fef91b2d "cleanup: remove dynacore/nativecore integration" —
# an active concurrent session removed those three from root `members` the
# same day this crate was built). `wasmtime` is also a heavy dependency
# tree; keeping it out of the root `Cargo.lock` avoids bloating every other
# crate's build in this workspace.
[workspace]

[package]
name = "agenterm-wasmcore"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A real wasmtime + wasmtime-wasi (p1) host: loads and runs wasm32-wasip1 guest modules, and exposes the same fleet_call(operation_id, params_json) -> result_json bridge shape as agenterm-rh/-lua/-qjs's ScriptFleetBridgeFn, marshalled across the WASM i32/linear-memory boundary. See README.md for the exact ABI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgttt/agenterm"
publish = false
autobins = false

[lib]
name = "agenterm_wasmcore"
path = "src/lib.rs"

[dependencies]
# Pinned to the current "47" line per dispatch instructions (verified via
# `cargo search wasmtime` at build time: 47.0.3 is current, not a stale
# pin) — NOT the older "27" a real crash was found and fixed by upgrading
# away from in this session's scratch proof.
wasmtime = "47"
wasmtime-wasi = { version = "47", features = ["p1"] }
# No `anyhow` dependency: `wasmtime::Error`/`Result`/`Context`/`bail!`/
# `format_err!` are "99% API-compatible with anyhow" (wasmtime's own doc
# comment) and are what every `wasmtime`/`wasmtime-wasi` call in this crate
# already returns -- using them directly avoids an error-type impedance
# mismatch at every `?` site (found the hard way: `wasmtime::Error` does
# not implement `std::error::Error`, so anyhow's `Context` blanket impl
# does not apply to `Result<T, wasmtime::Error>` -- verified via a real
# compile failure, not by inspection).

[dev-dependencies]
tempfile = "3.25"
