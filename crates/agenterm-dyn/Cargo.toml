[package]
name = "agenterm-dyn"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "In-process live native door: interned symbols, S-expr eval, bounded native dlcall"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
libloading = "0.8"
thiserror = "2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
libloading = "0.8"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
libloading = "0.8"
