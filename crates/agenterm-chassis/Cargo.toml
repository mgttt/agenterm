[package]
name = "agenterm-chassis"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "Chassis-L1 loader + L2 host ABI + L3 app image: pack, do not recompile the workbench"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "agenterm-chassis"
path = "src/bin/agenterm-chassis.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
