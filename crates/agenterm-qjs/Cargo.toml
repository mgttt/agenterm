[package]
name = "agenterm-qjs"
version = "0.1.15"
edition = "2024"
rust-version = "1.97"
description = "AgenTerm qjs pack language: QuickJS-backed script engine, capability-aligned with agenterm-rh"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgttt/agenterm"
publish = false
# No [[bin]] here — mirrors agenterm-rh's shape (see crates/agenterm-rh/Cargo.toml):
# the real `agenterm-qjs` binary is declared in the ROOT Cargo.toml's [[bin]]
# list with path = "crates/agenterm-qjs/src/main.rs", compiled as part of the
# root `agenterm` package so it can reach `agenterm::` internals (needed once
# QJS-M2 wires in task/run/L2 facade, same as agenterm-rh's main.rs already
# does for its --worker/--framed-worker/task modes).

[lib]
name = "agenterm_qjs"
path = "src/lib.rs"

[dependencies]
rquickjs = "0.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.25"
