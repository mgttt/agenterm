[package]
name = "agenterm-rh"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "AgenTerm rh pack language: subset check, transpile, and AOT pipeline"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/agenterm"
publish = false
autobins = false

[lib]
name = "agenterm_rh"
path = "src/lib.rs"

[dependencies]
agenterm-script-common = { path = "../agenterm-script-common" }
rhai = { version = "1.22", default-features = false, features = ["std", "internals"] }
sha2 = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.25"
libloading = "0.9"
