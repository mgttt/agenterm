[package]
name = "agenterm-abi"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "libagenterm — thin C ABI export shell (mechanism boundary, not product authority)"
license = "MIT OR Apache-2.0"
autolib = false

[lib]
# cdylib is the delivery artifact; rlib lets in-process consumers (agenterm-cu)
# call the same agt_* exports without dlopen.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The PTY mechanism (milestone 2). `pty` is a real feature: without it the
# whole `agenterm_platform::pty` module does not exist. `native-pixel-window`
# (milestone 3a) gates the `window_host` blocking callback loop, which in
# turn requires the `input` + `ime` features (its contract re-exports their
# types). `screenshot` (milestone 4) gates the whole
# `agenterm_platform::screenshot` module: without it the exports below cannot
# compile. `process` (milestone 5) gates the whole
# `agenterm_platform::process` module. `clipboard` (milestone 8) gates the
# whole `agenterm_platform::clipboard` module: without it the exports below
# cannot compile. `parent-console` (milestone 9) gates the whole
# `agenterm_platform::parent_console` module: without it the exports below
# cannot compile. `a11y-tree` (milestone 6) gates accessibility-tree observe
# and node actuation. `runtime` (milestone 10) gates the whole
# `agenterm_platform::runtime` module: without it the runtime exports below
# cannot compile.
agenterm-platform = { path = "../agenterm-platform", features = ["pty", "native-pixel-window", "portable-pixel-window", "input", "ime", "screenshot", "process", "clipboard", "parent-console", "a11y-tree", "runtime"] }

[dev-dependencies]
# The dylib-load acceptance regression (tests/dylib_load.rs) dlopens the built
# cdylib to prove the FFI contract (NUL-terminated C strings, §3.8 fence).
libloading = "0.8"
# c_consumer.rs uses cc::windows_registry::find_tool to locate the MSVC
# toolchain without requiring vcvarsall to have been sourced into PATH.
cc = "1.4"
