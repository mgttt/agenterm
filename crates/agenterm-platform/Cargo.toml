[package]
name = "agenterm-platform"
version = "0.1.11"
edition = "2024"
rust-version = "1.97"
description = "Typed operating-system contracts and adapters used by AgenTerm"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgttt/agenterm"
readme = "README.md"

[features]
default = []
serde = ["dep:serde"]
process = ["dep:libc", "dep:windows-sys"]
filesystem = []
locking = ["dep:libc", "dep:windows-sys"]
ipc = ["locking"]
pty = ["process", "dep:rmux-pty"]
window = []
input = ["window"]
ime = ["input"]
activation = ["window"]
clipboard = ["process"]
screenshot = ["filesystem"]
font = ["filesystem"]
webview = ["filesystem"]
full = [
    "process",
    "filesystem",
    "locking",
    "ipc",
    "pty",
    "window",
    "input",
    "ime",
    "activation",
    "clipboard",
    "screenshot",
    "font",
    "webview",
]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dependencies]
rmux-pty = { version = "0.9.1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Threading",
] }
