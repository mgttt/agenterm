[package]
name = "agenterm-platform"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "Typed operating-system contracts and adapters used by AgenTerm"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgttt/agenterm"
readme = "README.md"

[features]
default = []
native-pixel-window = ["window"]
portable-pixel-window = ["window", "dep:winit", "dep:softbuffer"]
serde = ["dep:serde"]
hardware = []
cache-hierarchy = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_SystemInformation",
]
virtualization-probe = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_LibraryLoader",
]
processor-topology = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_SystemInformation",
    "windows-sys/Win32_System_Threading",
]
processor-affinity = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_Threading",
]
host-memory = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_System_SystemInformation",
]
storage = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Storage_FileSystem",
]
entropy = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Security_Cryptography",
]
console-interrupt = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_Console",
]
console-line-editor = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_Console",
    "windows-sys/Win32_UI_Input_KeyboardAndMouse",
]
user-identity = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_System_Threading",
]
app-container-profile = [
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_Security_Authorization",
    "windows-sys/Win32_Security_Isolation",
]
app-container-process = [
    "app-container-profile",
    "process-conventions",
    "process-control",
    "process-reference",
    "process-spawn",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_System_Threading",
]
process-conventions = []
process-control = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_Threading",
]
process-observation = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_Threading",
]
process-security = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_System_Threading",
]
process-reference = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_System_JobObjects",
    "windows-sys/Win32_System_Threading",
]
process-containment = [
    "process-reference",
    "windows-sys/Win32_System_JobObjects",
    "windows-sys/Win32_System_SystemServices",
]
process-metrics = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_ProcessStatus",
    "windows-sys/Win32_System_Threading",
]
process-image = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_Threading",
]
process-spawn = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_Console",
    "windows-sys/Win32_System_Threading",
]
shared-memory = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_System_Memory",
]
process = [
    "parent-console",
    "runtime",
    "process-observation",
    "process-reference",
    "process-containment",
    "process-security",
    "process-control",
    "process-image",
    "process-metrics",
    "process-spawn",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_System_Console",
    "windows-sys/Win32_System_Diagnostics_ToolHelp",
    "windows-sys/Win32_System_JobObjects",
    "windows-sys/Win32_System_Pipes",
]
parent-console = [
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_Storage_FileSystem",
    "windows-sys/Win32_System_Console",
    "windows-sys/Win32_System_Threading",
]
runtime = [
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_Environment",
    "windows-sys/Win32_UI_Shell",
]
filesystem-conventions = []
filesystem-entry = []
directory-access = [
    "filesystem-entry",
    "filesystem-open",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_Security_Authorization",
]
filesystem-open = [
    "filesystem-conventions",
    "filesystem-entry",
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Storage_FileSystem",
]
filesystem-cleanup = ["filesystem-entry"]
filesystem-read = [
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_Storage_FileSystem",
    "windows-sys/Win32_System_IO",
]
filesystem-publish = [
    "filesystem-cleanup",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Storage_FileSystem",
]
filesystem-usage = ["filesystem-entry"]
file-identity = [
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Storage_FileSystem",
]
filesystem = [
    "filesystem-publish",
    "filesystem-conventions",
    "filesystem-entry",
    "directory-access",
    "filesystem-open",
    "file-identity",
    "user-identity",
    "windows-sys/Win32_Security_Authorization",
    "windows-sys/Win32_System_SystemServices",
]
locking = [
    "filesystem-conventions",
    "file-identity",
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_System_Threading",
]
ipc = [
    "user-identity",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_Storage_FileSystem",
    "windows-sys/Win32_System_IO",
    "windows-sys/Win32_System_Pipes",
]
pty = [
    "windows-sys/Win32_Security",
    "windows-sys/Win32_Storage_FileSystem",
    "windows-sys/Win32_System_Console",
    "windows-sys/Win32_System_Environment",
    "windows-sys/Win32_System_IO",
    "windows-sys/Win32_System_JobObjects",
    "windows-sys/Win32_System_Pipes",
    "windows-sys/Win32_System_SystemInformation",
    "windows-sys/Win32_System_Threading",
]
window = [
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:x11rb",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Graphics_Gdi",
    "windows-sys/Win32_System_LibraryLoader",
    "windows-sys/Win32_UI_Input_KeyboardAndMouse",
    "windows-sys/Win32_UI_WindowsAndMessaging",
]
input = ["window"]
ime = [
    "input",
    "windows-sys/Win32_Globalization",
    "windows-sys/Win32_UI_Input_Ime",
    "windows-sys/Win32_UI_HiDpi",
]
activation = ["portable-pixel-window"]
clipboard = [
    "windows-sys/Win32_System_DataExchange",
    "windows-sys/Win32_System_Memory",
]
screenshot = [
    "dep:png",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Graphics_Gdi",
    "windows-sys/Win32_Graphics_GdiPlus",
    "windows-sys/Win32_UI_WindowsAndMessaging",
]
font = [
    "dep:ab_glyph",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Graphics_Gdi",
]
webview = []
full = [
    "app-container-process",
    "hardware",
    "cache-hierarchy",
    "virtualization-probe",
    "processor-topology",
    "processor-affinity",
    "host-memory",
    "storage",
    "entropy",
    "console-interrupt",
    "user-identity",
    "shared-memory",
    "process-conventions",
    "process",
    "filesystem",
    "filesystem-entry",
    "filesystem-open",
    "filesystem-cleanup",
    "filesystem-read",
    "filesystem-publish",
    "filesystem-usage",
    "locking",
    "ipc",
    "pty",
    "window",
    "input",
    "ime",
    "activation",
    "clipboard",
    "screenshot",
    "font",
    "webview",
]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
ab_glyph = { version = "0.2.32", optional = true }
png = { version = "0.17", optional = true }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", optional = true, default-features = false, features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", optional = true, features = ["NSApplication", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.2.2", optional = true }

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
