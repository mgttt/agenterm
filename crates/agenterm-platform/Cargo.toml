[package]
name = "agenterm-platform"
version = "0.1.11"
edition = "2024"
rust-version = "1.97"
description = "Typed operating-system contracts and adapters used by AgenTerm"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgttt/agenterm"
readme = "README.md"

[features]
default = []
serde = ["dep:serde"]
process = ["dep:libc", "dep:windows-sys"]
filesystem = []
locking = ["dep:libc", "dep:windows-sys"]
ipc = ["locking"]
pty = ["process", "dep:rmux-pty"]
window = ["dep:windows-sys", "dep:winit", "dep:softbuffer"]
input = ["window"]
ime = ["input"]
activation = ["window", "dep:winit"]
clipboard = ["process"]
screenshot = ["filesystem", "dep:png", "dep:windows-sys"]
font = ["filesystem", "dep:ab_glyph", "dep:windows-sys"]
webview = []
full = [
    "process",
    "filesystem",
    "locking",
    "ipc",
    "pty",
    "window",
    "input",
    "ime",
    "activation",
    "clipboard",
    "screenshot",
    "font",
    "webview",
]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
ab_glyph = { version = "0.2.32", optional = true }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

[dependencies]
png = { version = "0.17", optional = true }
rmux-pty = { version = "0.9.1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
