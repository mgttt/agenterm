[package]
name = "agenterm-platform"
version = "0.1.11"
edition = "2024"
rust-version = "1.97"
description = "Typed operating-system contracts and adapters used by AgenTerm"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgttt/agenterm"
readme = "README.md"

[features]
default = []
serde = ["dep:serde"]
hardware = []
cache-hierarchy = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_SystemInformation",
]
virtualization-probe = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_LibraryLoader",
]
processor-topology = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_SystemInformation",
    "windows-sys/Win32_System_Threading",
]
processor-affinity = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_Threading",
]
host-memory = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_System_SystemInformation",
]
storage = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Storage_FileSystem",
]
entropy = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Security_Cryptography",
]
user-identity = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_System_Threading",
]
process-control = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_Threading",
]
process-metrics = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_ProcessStatus",
    "windows-sys/Win32_System_Threading",
]
process-image = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_Threading",
]
process-spawn = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_System_Console",
    "windows-sys/Win32_System_Threading",
]
shared-memory = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_System_Memory",
]
process = [
    "process-control",
    "process-image",
    "process-metrics",
    "process-spawn",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_System_Console",
    "windows-sys/Win32_System_Diagnostics_ToolHelp",
    "windows-sys/Win32_System_JobObjects",
    "windows-sys/Win32_System_Pipes",
]
filesystem-conventions = []
filesystem-cleanup = []
file-identity = [
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Storage_FileSystem",
]
filesystem = [
    "filesystem-conventions",
    "file-identity",
    "user-identity",
    "windows-sys/Win32_Security_Authorization",
]
locking = [
    "dep:libc",
    "dep:windows-sys",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_System_Threading",
]
ipc = [
    "locking",
    "user-identity",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_Storage_FileSystem",
    "windows-sys/Win32_System_IO",
    "windows-sys/Win32_System_Pipes",
]
pty = ["process", "dep:rmux-pty"]
window = [
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:x11rb",
    "dep:windows-sys",
    "dep:winit",
    "dep:softbuffer",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Graphics_Gdi",
    "windows-sys/Win32_System_LibraryLoader",
    "windows-sys/Win32_UI_Input_KeyboardAndMouse",
    "windows-sys/Win32_UI_WindowsAndMessaging",
]
input = ["window"]
ime = ["input"]
activation = ["window", "dep:winit"]
clipboard = [
    "process",
    "windows-sys/Win32_System_DataExchange",
    "windows-sys/Win32_System_Memory",
]
screenshot = [
    "filesystem",
    "dep:png",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Graphics_Gdi",
    "windows-sys/Win32_UI_WindowsAndMessaging",
]
font = [
    "filesystem",
    "dep:ab_glyph",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_Graphics_Gdi",
]
webview = []
full = [
    "hardware",
    "cache-hierarchy",
    "virtualization-probe",
    "processor-topology",
    "processor-affinity",
    "host-memory",
    "storage",
    "entropy",
    "user-identity",
    "shared-memory",
    "process",
    "filesystem",
    "filesystem-cleanup",
    "locking",
    "ipc",
    "pty",
    "window",
    "input",
    "ime",
    "activation",
    "clipboard",
    "screenshot",
    "font",
    "webview",
]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
ab_glyph = { version = "0.2.32", optional = true }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", optional = true, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.2.2", optional = true }

[dependencies]
png = { version = "0.17", optional = true }
rmux-pty = { version = "0.9.1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true }
