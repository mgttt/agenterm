[package]
name = "agenterm-tinyvm"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Tiny no_std, fmt-free WebAssembly 1.0 MVP interpreter (< 100 KiB static core); runs where JIT is forbidden (iOS, wasm)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
libm = "0.2"
ring = { version = "0.17", optional = true }

[dev-dependencies]
tempfile = "3.25"

[features]
staticcore = []
std = []
ios-c-api = ["std"]
cartridge-trust = ["std", "dep:ring"]
