[package]
name = "agenterm-tinyvm"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Tiny no_std, fmt-free standard WebAssembly VM (< 100 KiB static core); runs where JIT is forbidden (iOS, wasm)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
libm = "0.2"
ring = { version = "0.17", optional = true }
base64 = { version = "0.22", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
cap-std = { version = "4", optional = true }
getrandom = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3.25"
wat = "1"
serde_json = "1"
agenterm-tinyvm-qjs = { path = "../agenterm-tinyvm-qjs" }

[features]
staticcore = []
std = []
wasi-p1 = []
simd = []
std-host = ["std", "dep:cap-std", "dep:getrandom"]
ios-wasi-host = ["std-host", "wasi-p1"]
ios-c-api = ["cartridge-trust", "replay"]
cartridge-trust = ["std", "dep:ring"]
catalog-publisher = ["replay", "dep:base64", "dep:serde", "dep:serde_json"]
replay = ["cartridge-trust"]
