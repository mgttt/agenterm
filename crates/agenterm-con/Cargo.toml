[package]
name = "agenterm-con"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "Lightweight standalone terminal host for AgenTerm"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgttt/agenterm"
build = "build.rs"
autobins = false

[[bin]]
name = "agenterm-con"
path = "../../src/bin/agenterm-con.rs"

[[test]]
name = "agenterm_con_blackbox"
path = "../../tests/agenterm_con_blackbox.rs"

[[test]]
name = "agenterm_con_control"
path = "../../tests/agenterm_con_control.rs"

[dependencies]
agenterm-platform = { path = "../agenterm-platform", default-features = false, features = ["clipboard", "filesystem-publish", "filesystem-read", "font", "ime", "ipc", "parent-console", "pty", "runtime", "screenshot", "window"] }
agenterm-ui-core = { path = "../agenterm-ui-core", features = ["terminal-selection"] }
itoa = "1"
unicode-width = "0.2"
vt100 = "0.16"

[dev-dependencies]
png = "0.17"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
agenterm-platform = { path = "../agenterm-platform", default-features = false, features = ["native-pixel-window"] }

[target.'cfg(unix)'.dependencies]
agenterm-platform = { path = "../agenterm-platform", default-features = false, features = ["portable-pixel-window"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("default"))'] }
