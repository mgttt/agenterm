[package]
name = "agenterm-lua"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "LuaJIT scripting backend for AgenTerm (mlua + LuaJIT + vendored)"
license = "MIT OR Apache-2.0"

[dependencies]
mlua = { version = "0.12", features = ["luajit", "vendored", "serialize", "send"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
walkdir = "2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
