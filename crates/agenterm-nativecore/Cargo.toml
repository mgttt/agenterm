[package]
name = "agenterm-nativecore"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "ARCHIVED (2026-08-09, not 'dynacore' -- that name belongs to agenterm-dynacore): neutral IR with raw-memory ops, produce-time verification gate (incl. per-intent native-call-contract checks), content-addressed pack store, and an interpreter binding seven intents directly to real Win32 APIs -- no compiler in the loop, no executable memory ever requested. Code stays (opt-in, zero cost when unconfigured), no further investment. See plan/archive/design-dynacore-native-core.md."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgttt/agenterm"
publish = false
autobins = false

[lib]
name = "agenterm_nativecore"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
tempfile = "3.25"
