[package]
name = "agenterm-nativecore"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "dynacore (真身) v1: neutral IR with raw-memory ops, produce-time verification gate (incl. per-intent native-call-contract checks), content-addressed pack store, and an interpreter binding seven intents directly to real Win32 APIs -- no compiler in the loop, no executable memory ever requested. Joined the root workspace as an `agenterm` dependency in the product-integration round (see plan/design-dynacore-native-core.md §7)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgttt/agenterm"
publish = false
autobins = false

[lib]
name = "agenterm_nativecore"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
tempfile = "3.25"
