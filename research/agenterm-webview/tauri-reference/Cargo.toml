[package]
name = "agenterm-cc-web-tauri"
version = "0.1.12"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false
description = "Isolated minimal Tauri v2 comparison host for the AgenTerm system-WebView experiment"

[workspace]

[dependencies]
agenterm-cc-web = { path = "../crates/agenterm-cc-web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", default-features = false, features = ["custom-protocol", "wry"] }

[build-dependencies]
tauri-build = { version = "=2.6.3", default-features = false }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
