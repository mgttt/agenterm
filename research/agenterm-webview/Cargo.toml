[workspace]
members = ["crates/agenterm-cc-web", "crates/agenterm-cc-web-direct-wry"]
default-members = ["crates/agenterm-cc-web"]
resolver = "2"

[workspace.package]
version = "0.1.12"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
