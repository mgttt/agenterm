<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>35 Chrome Scroll Fixture</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  #viewport {
    height: 100%;
    overflow: auto;
    box-sizing: border-box;
  }
  #spacer {
    height: 2000px;
  }
  #field {
    display: block;
    width: 24rem;
    margin: 1rem;
    font-size: 1.25rem;
  }
</style>
</head>
<body>
  <div id="viewport" role="document" aria-label="ScrollViewport">
    <div id="spacer" aria-hidden="true"></div>
    <input id="field" type="text" aria-label="OffscreenField" value="35-offscreen">
  </div>
</body>
</html>
